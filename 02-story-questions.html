<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النشاط ٢: أجب عن سؤال</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7ff;color:#26344b;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:1.7}
header{padding:18px 12px;background:#e9f3ff;border-bottom:4px solid #cfe3f5}h1{font-size:clamp(1.35rem,5vw,2rem);margin:0}header p{margin:4px 0}
main{max-width:760px;margin:18px auto;padding:0 12px 28px}.card{background:white;border-radius:24px;padding:clamp(16px,4vw,26px);box-shadow:0 6px 22px #1e3b5b12}
.prompt{font-size:clamp(1.18rem,4vw,1.6rem);font-weight:bold;margin:8px 0 14px}.scene{background:#f7fbff;border:2px solid #e0eaf5;border-radius:20px;padding:12px;margin:10px 0}.picture{font-size:clamp(4rem,17vw,7rem);line-height:1.3}.storytext{font-size:1.15rem;font-weight:bold;min-height:64px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.choice{background:#fff9e9;border:3px solid #f0dfba;border-radius:20px;min-height:140px;padding:12px 6px;font:inherit;cursor:pointer;color:#26344b}
.choice .emoji{display:block;font-size:clamp(3rem,12vw,5rem)}.choice .label{font-size:1.03rem;font-weight:bold}
button:focus-visible{outline:4px solid #438bd0;outline-offset:3px}
.action{border:0;border-radius:15px;padding:12px 20px;margin:5px;background:#3979b8;color:white;font:inherit;font-weight:bold;cursor:pointer}
.sound{background:#7256a8}.next:disabled{opacity:.4;cursor:not-allowed}
.feedback{min-height:54px;font-size:1.12rem;font-weight:bold;margin:10px 0}.good{color:#208354}.try{color:#ad681b}
.progress{height:11px;background:#e8edf4;border-radius:20px;overflow:hidden;margin:14px 0 7px}.bar{height:100%;width:0;background:#61b98b;transition:width .2s}
.note{font-size:.9rem;color:#63738a;margin-top:12px}
@media(max-width:420px){.choices{gap:8px}.choice{min-height:122px}}
</style></head>
<body><header><h1>النشاط ٢: أجب عن سؤال</h1><p>اختر الإجابة من صورتين فقط</p></header><main><section class="card"><div class="prompt" id="question">ماذا وجدت لينا في الحديقة؟</div><div class="scene"><div class="picture" id="scene">👧🏻🌱</div></div>
<div class="choices" id="choices"></div><button class="action sound" onclick="repeat()">🔊 اسمع السؤال</button>
<div class="feedback" id="feedback" aria-live="polite"></div><div class="progress"><div class="bar" id="bar"></div></div><div id="count">السؤال ١ من ٣</div>
<button class="action next" id="next" onclick="advance()" disabled>التالي ←</button></section><p class="note">اضغط «اسمع» لسماع الكلام مرة أخرى. يمكنك الضغط على «التالي» للمتابعة.</p></main><script>const qs=[
{q:'ماذا وجدت لينا؟',scene:'👧🏻🌱',a:[['🌱','بذرة',1],['🐱','قطة',0]]},
{q:'ماذا أحضرت لينا؟',scene:'👧🏻💧🌱',a:[['⚽','كرة',0],['💧','ماء',1]]},
{q:'ماذا ظهر بعد أيام؟',scene:'🌱🌷',a:[['🌷','زهرة',1],['🚗','سيارة',0]]}
];let i=0,done=false;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=.8;speechSynthesis.speak(u)}}
function repeat(){say(qs[i].q);}
function render(){let q=qs[i];document.getElementById('question').textContent=q.q;document.getElementById('scene').textContent=q.scene;document.getElementById('choices').innerHTML=q.a.map((a,j)=>`<button class="choice" onclick="pick(${j})"><span class="emoji">${a[0]}</span><span class="label">${a[1]}</span></button>`).join('');document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('count').textContent='السؤال '+(i+1)+' من ٣';document.getElementById('bar').style.width=(i/3*100)+'%';done=false;}
function pick(j){if(done)return;if(qs[i].a[j][2]){done=true;document.getElementById('feedback').textContent='إجابة جميلة! أحسنت ⭐';document.getElementById('feedback').className='feedback good';document.getElementById('next').disabled=false;say('أحسنت! إجابة صحيحة.');}else{document.getElementById('feedback').textContent='حاول مرة أخرى. تذكر القصة.';document.getElementById('feedback').className='feedback try';say('حاول مرة أخرى.');}}
function advance(){i++;if(i===qs.length){document.querySelector('.card').innerHTML='<div class="picture">🏆</div><div class="prompt">أجبت عن أسئلة القصة!</div><div class="feedback good">أحسنت يا بطل ⭐⭐⭐</div><button class="action" onclick="location.reload()">العب مرة أخرى</button>';say('أحسنت! أجبت عن الأسئلة.');}else{render();repeat();}}
render();setTimeout(repeat,500);</script></body></html>
