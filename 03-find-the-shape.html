<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النشاط ٣: ابحث عن الشكل</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7ff;color:#26344b;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:1.65}
header{padding:18px 12px;background:#e9f3ff;border-bottom:4px solid #cfe3f5}h1{font-size:clamp(1.35rem,5vw,2rem);margin:0}header p{margin:4px 0}
main{max-width:760px;margin:18px auto;padding:0 12px 28px}.card{background:white;border-radius:24px;padding:clamp(16px,4vw,26px);box-shadow:0 6px 22px #1e3b5b12}
.prompt{font-size:clamp(1.18rem,4vw,1.6rem);font-weight:bold;margin:8px 0 14px}.big{font-size:clamp(4rem,18vw,7rem);line-height:1.3;margin:8px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.choice{background:#fff9e9;border:3px solid #f0dfba;border-radius:20px;min-height:140px;padding:12px 6px;font:inherit;cursor:pointer;color:#26344b}
.choice .emoji{display:block;font-size:clamp(3rem,12vw,5rem);line-height:1.3}.choice .label{font-size:1.03rem;font-weight:bold}
.action{border:0;border-radius:15px;padding:12px 20px;margin:5px;background:#3979b8;color:white;font:inherit;font-weight:bold;cursor:pointer}
.sound{background:#7256a8}.next:disabled{opacity:.4;cursor:not-allowed}
.feedback{min-height:54px;font-size:1.12rem;font-weight:bold;margin:10px 0}.good{color:#208354}.try{color:#ad681b}
.progress{height:11px;background:#e8edf4;border-radius:20px;overflow:hidden;margin:14px 0 7px}.bar{height:100%;width:0;background:#61b98b;transition:width .2s}
.note{font-size:.9rem;color:#63738a;margin-top:12px}
@media(max-width:420px){.choices{gap:8px}.choice{min-height:122px}}
</style></head>
<body><header><h1>النشاط ٣: ابحث عن الشكل</h1><p>ميز الدائرة والمربع والمثلث</p></header><main><section class="card"><div class="prompt" id="prompt">أين الدائرة؟ اضغط عليها</div><div class="choices" id="choices"></div>
<button class="action sound" onclick="repeat()">🔊 اسمع</button><div class="feedback" id="feedback" aria-live="polite"></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="count">١ من ٤</div><button class="action next" id="next" onclick="advance()" disabled>التالي ←</button></section><p class="note">اضغط «اسمع» لسماع التعليمات مرة أخرى. اختر الإجابة بالضغط على الصورة.</p></main><script>const qs=[
{q:'أين الدائرة؟',a:[['🔺','مثلث',0],['🔴','دائرة',1]]},
{q:'أين المربع؟',a:[['🟦','مربع',1],['🔴','دائرة',0]]},
{q:'أين المثلث؟',a:[['🔴','دائرة',0],['🔺','مثلث',1]]},
{q:'أين الدائرة؟',a:[['🟦','مربع',0],['🟡','دائرة',1]]}
];let i=0,done=false;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=.8;speechSynthesis.speak(u)}}
function repeat(){say(qs[i].q+' اضغط على الشكل الصحيح.');}
function render(){document.getElementById('prompt').textContent=qs[i].q+' اضغط عليها.';document.getElementById('choices').innerHTML=qs[i].a.map((a,j)=>`<button class="choice" onclick="pick(${j})"><span class="emoji">${a[0]}</span><span class="label">${a[1]}</span></button>`).join('');document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('count').textContent=(i+1)+' من ٤';document.getElementById('bar').style.width=(i/4*100)+'%';done=false;}
function pick(j){if(done)return;if(qs[i].a[j][2]){done=true;document.getElementById('feedback').textContent='وجدته! أحسنت ⭐';document.getElementById('feedback').className='feedback good';document.getElementById('next').disabled=false;say('أحسنت! وجدته.');}else{document.getElementById('feedback').textContent='ليس هذا الشكل. جرب مرة أخرى.';document.getElementById('feedback').className='feedback try';say('جرب مرة أخرى.');}}
function advance(){i++;if(i===qs.length){document.querySelector('.card').innerHTML='<div class="big">🌟</div><div class="prompt">رائع! ميزت الأشكال المختلفة.</div><button class="action" onclick="location.reload()">العب مرة أخرى</button>';say('رائع!');}else{render();repeat();}}
render();setTimeout(repeat,500);</script></body></html>
