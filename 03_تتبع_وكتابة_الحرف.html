<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>نشاط تتبّع وكتابة الحرف</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eaf6ff,#fff7e9);color:#26384d}
main{max-width:900px;margin:auto;padding:14px}
header,.card{background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 7px 24px #24364b14}
h1{font-size:clamp(27px,5vw,38px);color:#2d6fa7;margin:5px}
.sub{font-size:18px;line-height:1.7;color:#73849a}
.card{margin-top:15px}
.prompt{font-size:clamp(21px,4vw,28px);font-weight:bold;margin:18px 0}
.big{font-size:100px;color:#28659d;font-weight:bold;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:650px;margin:20px auto}
.choice{border:3px solid #dceaf6;border-radius:18px;background:#f8fbff;min-height:105px;font-size:55px;color:#28659d;cursor:pointer;padding:10px}
.pictures{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:760px;margin:18px auto}
.picchoice{border:3px solid #dceaf6;border-radius:20px;background:#f8fbff;padding:12px 8px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.emoji{font-size:60px;line-height:1.2}.word{font-size:19px;font-weight:bold}
.feedback{font-size:25px;font-weight:bold;min-height:38px;margin:14px 0;color:#29966b}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{border:0;border-radius:16px;padding:12px 22px;font-size:18px;font-weight:bold;cursor:pointer;background:#2d6fa7;color:white}
button.listen{background:#f2bd51;color:#513b12}button.light{background:#eaf2f8;color:#34516b}
button:disabled{opacity:.4;cursor:not-allowed}
.progress{height:11px;background:#e8edf4;border-radius:20px;overflow:hidden;max-width:620px;margin:14px auto 0}
.bar{height:100%;width:0;background:#5bc59a;transition:.2s}
.note{font-size:14px;color:#8290a0;line-height:1.7;margin-top:12px}
.traceboard{position:relative;width:min(100%,560px);height:280px;margin:16px auto;background:#fbfdff;border:3px solid #dceaf6;border-radius:22px;overflow:hidden;touch-action:none}
.traceboard svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.traceboard svg text{font-family:Tahoma,Arial,sans-serif;font-size:205px;font-weight:bold;fill:none;stroke:#c6d7e7;stroke-width:3;stroke-dasharray:3 8;text-anchor:middle;dominant-baseline:middle}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
@media(max-width:560px){main{padding:9px}.grid{grid-template-columns:repeat(4,1fr);gap:7px}.choice{font-size:43px;min-height:80px}.pictures{gap:7px}.picchoice{min-height:125px}.emoji{font-size:46px}.word{font-size:16px}.traceboard{height:235px}}
</style></head><body><main><header><div style="font-size:36px">🔤 ✏️</div><h1>نشاط تتبّع وكتابة الحرف</h1><div class="sub">تدرّب على كتابة الحرف بإصبعك أو باستخدام الفأرة.</div><div class="progress"><div class="bar" id="bar"></div></div></header><section class="card" id="card"><div class="prompt" id="prompt">تتبّع الحرف فوق الخط المنقّط.</div><div class="big" id="letter"></div><div class="traceboard"><svg viewBox="0 0 500 280"><text id="guide" x="250" y="145">ا</text></svg><canvas id="draw"></canvas></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="light" id="clear">مسح وإعادة</button><button class="listen" id="listen">🔊 استمع</button><button id="done">انتهيت</button><button id="next" disabled>التالي ←</button></div><div class="note">هذا النشاط للتدريب على التتبع. لا يصدر حكمًا آليًا على صحة شكل الكتابة؛ تتابع المعلمة اتجاه الكتابة وتكوين الحرف.</div></section></main><script>
const data=[["ا","ألف"],["ب","باء"],["ت","تاء"],["م","ميم"]];
let n=0,hasDrawn=false,completed=false,drawing=false,last=null;
const $=x=>document.getElementById(x);
const canvas=$("draw"),ctx=canvas.getContext("2d");
function say(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ar";u.rate=.85;speechSynthesis.speak(u)}
function fit(){let r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=10;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#28659d"}
function render(){completed=false;hasDrawn=false;$("feedback").textContent="";$("next").disabled=true;$("bar").style.width=(n/data.length*100)+"%";$("letter").textContent=data[n][0];$("guide").textContent=data[n][0];clear();fit()}
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);hasDrawn=false;completed=false;$("feedback").textContent="";$("next").disabled=true}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{if(completed)return;drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;let p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;hasDrawn=true});
function stop(){drawing=false;last=null}
canvas.addEventListener("pointerup",stop);canvas.addEventListener("pointercancel",stop);
$("clear").onclick=clear;
$("listen").onclick=()=>say("حرف "+data[n][1]);
$("done").onclick=()=>{if(!hasDrawn){$("feedback").textContent="حاول مرة أخرى";$("feedback").style.color="#b47722";say("حاول مرة أخرى");return}completed=true;$("feedback").textContent="ممتاز";$("feedback").style.color="#29966b";$("next").disabled=false;say("ممتاز")};
$("next").onclick=()=>{n++;if(n===data.length){$("card").innerHTML='<div style="font-size:48px">🎉</div><h2 style="color:#29966b">ممتاز</h2><button onclick="location.reload()">إعادة النشاط</button>';$("bar").style.width="100%"}else render()};
window.addEventListener("resize",()=>{if(!hasDrawn)fit()});
render();
</script></body></html>
