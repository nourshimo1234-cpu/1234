<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أشياء زرقاء حولي</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;display:grid;place-items:center;background:#eaf4ff;font-family:Tahoma,Arial,sans-serif;color:#23384d}
main{width:min(850px,100%);background:white;border-radius:24px;padding:22px;box-shadow:0 10px 30px #1d45631c;text-align:center}
h1{color:#145da0;margin:4px 0 10px;font-size:clamp(25px,4vw,34px)}p{font-size:18px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:690px;margin:18px auto}
.tile{border:3px solid #dce8f4;background:#fbfdff;border-radius:18px;min-height:150px;padding:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:inherit;box-shadow:0 4px 0 #e3edf6}
.art{height:90px;width:100%;display:grid;place-items:center}.art svg{width:100%;height:100%;max-width:135px}.label{font-weight:bold;font-size:17px}
.tile.correct{border-color:#26975b;background:#effcf4}.tile.selected{border-color:#2589e8;background:#edf6ff}.tile.wrong{animation:shake .25s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.feedback{min-height:52px;color:#238653;font-size:20px;font-weight:bold;line-height:1.6}
.action{border:0;border-radius:14px;background:#1976d2;color:white;padding:12px 20px;min-height:46px;font:inherit;font-weight:bold;cursor:pointer}
.action:disabled{opacity:.45}.light{background:#edf2f7;color:#34495e}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px}
.word{display:inline-block;background:#1976d2;color:white;border-radius:16px;padding:12px 32px;font-size:32px;font-weight:bold}
.prompt{background:#eef6ff;border:2px dashed #83b9e9;border-radius:16px;padding:12px;margin:12px auto}.note{font-size:13px;color:#64748b}
@media(max-width:560px){.grid{gap:7px}.tile{min-height:120px;padding:6px}.art{height:72px}.label{font-size:14px}}
</style></head><body><main><h1>🧸 أشياء زرقاء حولي</h1><p>اضغط على الصورة، واستمع إلى اسم الشيء، ثم قل: هذا أزرق أو هذه زرقاء.</p><div class="grid" id="grid"></div><div class="prompt"><strong>سؤال المعلمة:</strong><p id="question">اضغط على صورة، ثم قل اسم الشيء ولونه.</p></div><div class="feedback" id="fb">هيا نتعرف على الأشياء الزرقاء!</div><div class="actions"><button class="action" id="ask">اسمع السؤال</button><button class="action light" id="reset">ابدأ من جديد</button></div><p class="note">كل الأشياء هنا مرسومة باللون الأزرق الصريح: كرة، مكعب، كوب، سيارة، قميص، قلم.</p><script>
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ar-EG";u.rate=.82;u.pitch=1.12;let vs=speechSynthesis.getVoices(),ar=vs.filter(v=>/^ar([_-]|$)/i.test(v.lang));if(ar[0])u.voice=ar[0];speechSynthesis.speak(u);}
const art={"blue_ball": "<svg viewBox=\"0 0 140 100\"><circle cx=\"70\" cy=\"50\" r=\"38\" fill=\"#0878d1\" stroke=\"#064f91\" stroke-width=\"4\"/><path d=\"M39 29Q70 50 101 29M39 71Q70 50 101 71\" fill=\"none\" stroke=\"#bfe7ff\" stroke-width=\"4\"/></svg>", "blue_cube": "<svg viewBox=\"0 0 140 100\"><path d=\"M70 9L119 34L70 59L21 34Z\" fill=\"#58b4f2\" stroke=\"#075da8\" stroke-width=\"3\"/><path d=\"M21 34L70 59V94L21 68Z\" fill=\"#0878d1\" stroke=\"#075da8\" stroke-width=\"3\"/><path d=\"M119 34L70 59V94L119 68Z\" fill=\"#1266b5\" stroke=\"#075da8\" stroke-width=\"3\"/></svg>", "blue_cup": "<svg viewBox=\"0 0 140 100\"><path d=\"M34 20H98L91 87H42Z\" fill=\"#0878d1\" stroke=\"#064f91\" stroke-width=\"4\"/><path d=\"M98 31H111Q128 31 121 54Q117 68 94 66\" fill=\"none\" stroke=\"#064f91\" stroke-width=\"8\"/><path d=\"M43 31H91\" stroke=\"#8fd2ff\" stroke-width=\"4\"/></svg>", "blue_car": "<svg viewBox=\"0 0 140 100\"><path d=\"M18 60L30 37Q34 30 44 30H91Q100 30 105 40L119 60Q126 63 126 73V80H14V69Q14 62 18 60Z\" fill=\"#0878d1\" stroke=\"#064f91\" stroke-width=\"3\"/><path d=\"M42 36H67V56H31ZM73 36H91Q96 36 99 44L106 56H73Z\" fill=\"#dff4ff\" stroke=\"#064f91\" stroke-width=\"2\"/><circle cx=\"39\" cy=\"79\" r=\"10\" fill=\"#263746\"/><circle cx=\"101\" cy=\"79\" r=\"10\" fill=\"#263746\"/></svg>", "blue_shirt": "<svg viewBox=\"0 0 140 100\"><path d=\"M48 15L28 25L10 49L28 62L40 49V91H100V49L112 62L130 49L112 25L92 15Q84 30 70 30Q56 30 48 15Z\" fill=\"#0878d1\" stroke=\"#064f91\" stroke-width=\"3\"/></svg>", "blue_pencil": "<svg viewBox=\"0 0 140 100\"><path d=\"M30 72L83 19L111 47L58 100Z\" fill=\"#0878d1\" stroke=\"#064f91\" stroke-width=\"3\"/><path d=\"M30 72L18 108L58 100Z\" fill=\"#f3d2a2\" stroke=\"#8a6338\" stroke-width=\"2\"/><path d=\"M83 19L94 8Q100 2 106 8L122 24Q128 30 122 36L111 47Z\" fill=\"#9bd7ff\" stroke=\"#064f91\" stroke-width=\"3\"/></svg>", "red_apple": "<svg viewBox=\"0 0 140 100\"><path d=\"M70 31Q48 15 28 34Q9 56 30 83Q48 102 70 86Q92 102 110 83Q131 56 112 34Q92 15 70 31Z\" fill=\"#e53935\" stroke=\"#a51f1c\" stroke-width=\"3\"/><path d=\"M70 31Q69 18 78 10\" stroke=\"#70451f\" stroke-width=\"6\" fill=\"none\"/><path d=\"M76 19Q94 8 103 19Q88 30 76 19Z\" fill=\"#39a85a\"/></svg>", "yellow_banana": "<svg viewBox=\"0 0 140 100\"><path d=\"M22 24Q40 70 105 65Q118 62 123 48Q121 84 86 88Q34 91 12 38Z\" fill=\"#f5d21b\" stroke=\"#b58a00\" stroke-width=\"3\"/></svg>", "green_cup": "<svg viewBox=\"0 0 140 100\"><path d=\"M34 20H98L91 87H42Z\" fill=\"#2da653\" stroke=\"#176b35\" stroke-width=\"4\"/><path d=\"M98 31H111Q128 31 121 54Q117 68 94 66\" fill=\"none\" stroke=\"#176b35\" stroke-width=\"8\"/></svg>", "yellow_sun": "<svg viewBox=\"0 0 140 100\"><circle cx=\"70\" cy=\"50\" r=\"25\" fill=\"#f5c518\"/><g stroke=\"#d69e00\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M70 8V17M70 83V92M28 50H18M122 50H112M40 20L33 13M100 80L107 87M100 20L107 13M40 80L33 87\"/></g></svg>", "red_ball": "<svg viewBox=\"0 0 140 100\"><circle cx=\"70\" cy=\"50\" r=\"38\" fill=\"#e53935\" stroke=\"#a51f1c\" stroke-width=\"4\"/><path d=\"M39 29Q70 50 101 29M39 71Q70 50 101 71\" fill=\"none\" stroke=\"#ffd0ce\" stroke-width=\"4\"/></svg>", "green_ball": "<svg viewBox=\"0 0 140 100\"><circle cx=\"70\" cy=\"50\" r=\"38\" fill=\"#2da653\" stroke=\"#176b35\" stroke-width=\"4\"/><path d=\"M39 29Q70 50 101 29M39 71Q70 50 101 71\" fill=\"none\" stroke=\"#c9f4d6\" stroke-width=\"4\"/></svg>"};
const items=[['blue_ball','كرة','هذه كرة زرقاء.','ما لون الكرة؟'],['blue_cube','مكعب','هذا مكعب أزرق.','ما لون المكعب؟'],['blue_cup','كوب','هذا كوب أزرق.','ما لون الكوب؟'],['blue_car','سيارة','هذه سيارة زرقاء.','ما لون السيارة؟'],['blue_shirt','قميص','هذا قميص أزرق.','ما لون القميص؟'],['blue_pencil','قلم','هذا قلم أزرق.','ما لون القلم؟']];
let grid=document.getElementById('grid'),fb=document.getElementById('fb'),q=document.getElementById('question'),selected=null;
items.forEach(([a,n,s,ask])=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span class="art">'+art[a]+'</span><span class="label">'+n+'</span>';b.onclick=()=>{document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));b.classList.add('selected');selected=ask;fb.textContent=s;q.textContent=ask;speak(s+' '+ask)};grid.appendChild(b)});
document.getElementById('ask').onclick=()=>speak(selected||'اختر صورة وقل اسم الشيء ولونه.');
document.getElementById('reset').onclick=()=>{selected=null;document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));fb.textContent='هيا نتعرف على الأشياء الزرقاء!';q.textContent='اضغط على صورة، ثم قل اسم الشيء ولونه.';speak('هيا نتعرف على الأشياء الزرقاء.')};

</script></main></body></html>
