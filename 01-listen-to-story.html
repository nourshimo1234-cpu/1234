<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النشاط ١: استمع إلى القصة</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7ff;color:#26344b;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:1.7}
header{padding:18px 12px;background:#e9f3ff;border-bottom:4px solid #cfe3f5}h1{font-size:clamp(1.35rem,5vw,2rem);margin:0}header p{margin:4px 0}
main{max-width:760px;margin:18px auto;padding:0 12px 28px}.card{background:white;border-radius:24px;padding:clamp(16px,4vw,26px);box-shadow:0 6px 22px #1e3b5b12}
.prompt{font-size:clamp(1.18rem,4vw,1.6rem);font-weight:bold;margin:8px 0 14px}.scene{background:#f7fbff;border:2px solid #e0eaf5;border-radius:20px;padding:12px;margin:10px 0}.picture{font-size:clamp(4rem,17vw,7rem);line-height:1.3}.storytext{font-size:1.15rem;font-weight:bold;min-height:64px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.choice{background:#fff9e9;border:3px solid #f0dfba;border-radius:20px;min-height:140px;padding:12px 6px;font:inherit;cursor:pointer;color:#26344b}
.choice .emoji{display:block;font-size:clamp(3rem,12vw,5rem)}.choice .label{font-size:1.03rem;font-weight:bold}
button:focus-visible{outline:4px solid #438bd0;outline-offset:3px}
.action{border:0;border-radius:15px;padding:12px 20px;margin:5px;background:#3979b8;color:white;font:inherit;font-weight:bold;cursor:pointer}
.sound{background:#7256a8}.next:disabled{opacity:.4;cursor:not-allowed}
.feedback{min-height:54px;font-size:1.12rem;font-weight:bold;margin:10px 0}.good{color:#208354}.try{color:#ad681b}
.progress{height:11px;background:#e8edf4;border-radius:20px;overflow:hidden;margin:14px 0 7px}.bar{height:100%;width:0;background:#61b98b;transition:width .2s}
.note{font-size:.9rem;color:#63738a;margin-top:12px}
@media(max-width:420px){.choices{gap:8px}.choice{min-height:122px}}
</style></head>
<body><header><h1>النشاط ١: استمع إلى القصة</h1><p>قصة قصيرة مصورة بصوت عربي</p></header><main><section class="card"><div class="prompt">قصة لينا والبذرة 🌱</div><div class="scene"><div class="picture" id="pic">👧🏻🌱</div><div class="storytext" id="line">في الصباح، رأت لينا بذرة صغيرة في الحديقة.</div></div>
<button class="action sound" onclick="listen()">🔊 اسمع القصة</button><button class="action next" id="next" onclick="next()">التالي ←</button>
<div class="progress"><div class="bar" id="bar"></div></div><div id="count">الصورة ١ من ٣</div><div class="feedback" id="feedback" aria-live="polite"></div></section><p class="note">اضغط «اسمع» لسماع الكلام مرة أخرى. يمكنك الضغط على «التالي» للمتابعة.</p></main><script>const pages=[['👧🏻🌱','في الصباح، رأت لينا بذرة صغيرة في الحديقة.'],['👧🏻💧🌱','أحضرت لينا كوب ماء، وسقت البذرة.'],['🌱🌷😊','بعد أيام، ظهرت زهرة جميلة. فرحت لينا!']];
let i=0;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=.78;speechSynthesis.speak(u)}}
function listen(){say(pages[i][1]);}
function next(){if(i<2){i++;document.getElementById('pic').textContent=pages[i][0];document.getElementById('line').textContent=pages[i][1];document.getElementById('count').textContent='الصورة '+(i+1)+' من ٣';document.getElementById('bar').style.width=(i/3*100)+'%';document.getElementById('feedback').textContent='';listen();}else{document.getElementById('feedback').textContent='أحسنت! استمعت إلى القصة كلها ⭐';document.getElementById('feedback').className='feedback good';document.getElementById('next').textContent='استمع مرة أخرى';document.getElementById('next').onclick=()=>location.reload();say('أحسنت! استمعت إلى القصة كلها.');}}
setTimeout(()=>say('مرحبًا! استمع إلى قصة لينا. اضغط اسمع القصة.'),500);</script></body></html>
