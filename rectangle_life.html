<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المستطيل حولنا</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Tahoma,Arial;background:linear-gradient(135deg,#fff2e6,#eaf4ff);color:#29364b}.wrap{max-width:1000px;margin:auto}.hero{background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 7px 20px #23415a18}.hero h1{margin:0;color:#c16d28;font-size:clamp(26px,4vw,38px)}.hero p{font-size:19px}.question{text-align:center;font-size:25px;font-weight:bold;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{border:3px solid transparent;border-radius:22px;background:white;padding:15px;min-height:210px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:pointer;box-shadow:0 5px 15px #263c5015}.item:hover{border-color:#f2b66d}.art{height:115px;display:flex;align-items:center;justify-content:center}.door{height:105px;width:70px;background:#b77b4c;border:7px solid #82512e;border-radius:5px 5px 0 0;position:relative}.door:after{content:'';position:absolute;right:8px;top:52px;width:8px;height:8px;border-radius:50%;background:#f8d76b}.book{width:125px;height:88px;background:#ed7890;border:7px solid #b84e6a;border-radius:8px;position:relative}.book:after{content:'';position:absolute;right:50%;height:100%;border-right:4px solid #fff;top:0}.window{width:120px;height:90px;background:#8bd3ed;border:9px solid #986b45;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.window i{border:2px solid #986b45}.ball{width:92px;height:92px;border-radius:50%;background:#f5a735;border:5px solid #d47c1a}.slice{width:0;height:0;border-left:52px solid transparent;border-right:52px solid transparent;border-bottom:100px solid #70b985}.clock{width:95px;height:95px;border-radius:50%;border:9px solid #637b9b;background:#fff;position:relative}.clock:before{content:'';position:absolute;width:4px;height:30px;background:#637b9b;left:39px;top:14px;transform:rotate(0deg);transform-origin:bottom}.clock:after{content:'';position:absolute;width:25px;height:4px;background:#637b9b;left:39px;top:42px}.name{font-size:20px;font-weight:bold}.msg{text-align:center;min-height:45px;font-size:22px;font-weight:bold;margin:18px}.buttons{text-align:center}button{border:0;border-radius:14px;padding:13px 23px;background:#c16d28;color:white;font-size:18px;font-weight:bold;cursor:pointer}.secondary{background:#4c8db8;margin-right:8px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><header class="hero"><h1>🏡 المستطيل حولنا</h1><p>هل ترى أشياء في حياتك تشبه المستطيل؟ اختر الأشياء المستطيلة.</p></header><div class="question">اضغط على الأشياء التي تشبه المستطيل</div><section class="grid" id="grid"></section><div class="msg" id="msg">فكّر: هل يشبه الباب شكل المستطيل؟</div><div class="buttons"><button onclick="reset()">ابدأ من جديد ↻</button><button class="secondary" onclick="hint()">اسمع السؤال 🔊</button></div></main>
<script>
const data=[{n:'الباب',c:'door',ok:true},{n:'الكتاب',c:'book',ok:true},{n:'النافذة',c:'window',ok:true},{n:'الكرة',c:'ball',ok:false},{n:'شريحة البطيخ',c:'slice',ok:false},{n:'الساعة',c:'clock',ok:false}];let selected=new Set(),good=0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.85;speechSynthesis.speak(u)}
function draw(){document.getElementById('grid').innerHTML=shuffle(data).map((x,i)=>`<button class="item" id="i${i}" onclick="choose(${i},${x.ok},'${x.n}')"><span class="art"><span class="${x.c}">${x.c==='window'?'<i></i><i></i><i></i><i></i>':''}</span></span><span class="name">${x.n}</span></button>`).join('');window.items=shuffle([]);document.getElementById('msg').textContent='اختر الباب والكتاب والنافذة.';selected.clear();good=0}
function choose(i,ok,n){if(selected.has(i))return;selected.add(i);let e=document.getElementById('i'+i);if(ok){good++;e.style.borderColor='#23aa83';e.style.background='#eafff5';e.disabled=true;document.getElementById('msg').textContent='أحسنت! '+n+' يشبه المستطيل.';speak('أحسنت! '+n+' يشبه المستطيل.')}else{e.style.borderColor='#e6a14c';document.getElementById('msg').textContent='هذه ليست مستطيلاً. حاول مع شيء آخر.';speak('هذه ليست مستطيلاً.')}if(good===3){document.getElementById('msg').textContent='🌟 ممتاز! عرفت الأشياء المستطيلة حولك.';speak('ممتاز! عرفت الأشياء المستطيلة حولك.')}}
function reset(){draw()}function hint(){speak('أين ترى شكلاً مستطيلاً؟ انظر إلى الباب والكتاب والنافذة.')}draw();
</script></body></html>
