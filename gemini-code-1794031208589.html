<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهدف 3: التمييز بين النبات والحيوان</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background: #ebf5fb; color: #2c3e50; margin: 0; padding: 20px; }
    h1 { color: #2980b9; font-size: 1.8rem; margin-bottom: 5px; }
    p { font-size: 1.1rem; font-weight: bold; color: #7f8c8d; }
    .game-card { background: white; border-radius: 25px; padding: 25px; max-width: 500px; margin: 25px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 4px solid #3498db; }
    .target-icon { font-size: 6rem; margin: 10px 0; cursor: pointer; }
    .target-name { font-size: 1.5rem; font-weight: bold; color: #2c3e50; margin-bottom: 20px; }
    .btn-group { display: flex; gap: 15px; justify-content: center; }
    .btn { font-size: 1.3rem; font-weight: bold; padding: 15px 30px; border: none; border-radius: 15px; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-plant { background: #27ae60; }
    .btn-animal { background: #e67e22; }
    .btn:active { transform: scale(0.95); }
    #feedback { font-size: 1.4rem; font-weight: bold; margin-top: 20px; min-height: 40px; }
    .score-badge { font-size: 1.2rem; background: #f39c12; color: white; padding: 8px 20px; border-radius: 50px; display: inline-block; font-weight: bold; margin-top: 10px; }
    .speaker-tip { font-size: 0.9rem; color: #2980b9; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🧩 النشاط الثالث: لعبة التمييز الذكي (نبات أم حيوان؟)</h1>
  <p>حدد هل الكائن المعروض نبات ينمو أم حيوان يتحرك:</p>

  <div class="game-card">
    <div class="speaker-tip">🔊 اضغط على الصورة لسماع الاسم:</div>
    <div id="targetIcon" class="target-icon" onclick="speakCurrentItem()" title="اضغط لسماع الاسم">🌴</div>
    <div id="targetName" class="target-name">نخلة</div>
    
    <div class="btn-group">
      <button class="btn btn-plant" onclick="checkAnswer('plant')">🌱 نبات</button>
      <button class="btn btn-animal" onclick="checkAnswer('animal')">🦁 حيوان</button>
    </div>
    
    <div id="feedback"></div>
  </div>

  <div class="score-badge">⭐ النقاط: <span id="score">0</span> / 6</div>

  <script>
    const quizItems = [
      { name: 'نخلة طويلة', icon: '🌴', type: 'plant' },
      { name: 'أسد الغابة', icon: '🦁', type: 'animal' },
      { name: 'وردة جميلة', icon: '🌸', type: 'plant' },
      { name: 'أرنب سريع', icon: '🐰', type: 'animal' },
      { name: 'شجرة تفاح', icon: '🍎', type: 'plant' },
      { name: 'فيل ضخم', icon: '🐘', type: 'animal' }
    ];

    let currentIndex = 0;
    let score = 0;

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakCurrentItem() {
      speakText(quizItems[currentIndex].name);
    }

    // نطق السؤال تلقائياً عند فتح السؤال
    window.onload = function() {
      speakCurrentItem();
    };

    function checkAnswer(selectedType) {
      const current = quizItems[currentIndex];
      const fb = document.getElementById('feedback');
      
      if (selectedType === current.type) {
        score++;
        document.getElementById('score').innerText = score;
        fb.innerHTML = '<span style="color:#27ae60;">🎉 إجابة صحيحة بطلنا الرائع! أحسنت التمييز 🌟</span>';
        speakText("أحسنت، إجابة صحيحة!");
        setTimeout(nextQuestion, 1800);
      } else {
        fb.innerHTML = '<span style="color:#e74c3c;">❌ خطأ بسيط، فكر هل هو نبات أم حيوان؟ حاول مجدداً 💪</span>';
        speakText("حاول مرة أخرى");
      }
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % quizItems.length;
      document.getElementById('targetIcon').innerText = quizItems[currentIndex].icon;
      document.getElementById('targetName').innerText = quizItems[currentIndex].name;
      document.getElementById('feedback').innerText = '';
      speakCurrentItem();
    }
  </script>
</body>
</html>
