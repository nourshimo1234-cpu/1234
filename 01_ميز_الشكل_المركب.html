<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>من أجزاء إلى شكل جميل</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf7ff,#fff5e8);font-family:Tahoma,Arial,sans-serif;color:#26364d;direction:rtl}
.wrap{max-width:980px;margin:auto;padding:16px}.hero,.game,.finish{background:#fff;border-radius:26px;padding:22px;text-align:center;box-shadow:0 8px 24px #26364d14}
h1{font-size:clamp(27px,5vw,42px);color:#28639d;margin:8px 0}.sub{font-size:21px;color:#71839a}.intro{font-size:19px;line-height:1.7}
.progress{height:13px;max-width:620px;margin:18px auto 0;background:#e8edf4;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#58c49b;transition:.25s}
.game{margin-top:18px}.count{color:#71839a;font-weight:bold;font-size:18px}.picture{height:155px;display:flex;align-items:center;justify-content:center;margin:8px auto}.picture svg{height:145px;max-width:190px}.emoji{font-size:100px}
.question{font-size:clamp(22px,4vw,30px);font-weight:bold;line-height:1.5;margin:10px 0 18px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.opt{background:#f7fbff;border:3px solid #dceaf6;border-radius:20px;padding:12px;min-height:145px;font-size:20px;font-weight:bold;color:#30445d;cursor:pointer}
.opt svg{display:block;width:100%;height:90px;margin:auto}.opt .label{display:block;margin-top:5px}.opt:hover{border-color:#72b8e6;transform:translateY(-2px)}.opt.good{background:#e9faef;border-color:#55bf83}.opt.bad{background:#fff0ed;border-color:#e99584}
.feedback{font-size:25px;font-weight:bold;min-height:42px;margin:15px 0;color:#24855f}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button.action{border:0;border-radius:18px;padding:13px 24px;font-size:19px;font-weight:bold;background:#347fbd;color:#fff;cursor:pointer}button.alt{background:#f2bd51;color:#533d10}button:disabled{opacity:.45;cursor:not-allowed}
.hide{display:none}.stars{font-size:34px;color:#e8ad32}.small{font-size:15px;color:#7b8797;margin-top:14px}
@media(max-width:650px){.options{grid-template-columns:1fr}.opt{min-height:95px;display:flex;align-items:center;justify-content:center;gap:14px}.opt svg{width:90px;height:75px;margin:0}.picture{height:130px}.picture svg{height:125px}}
</style></head><body><main class="wrap">
<header class="hero"><div style="font-size:40px">🔺 🟦 🔵</div><h1 id="title"></h1><div class="sub" id="subtitle"></div><p class="intro" id="intro"></p><div class="progress"><div class="bar" id="bar"></div></div></header>
<section class="game" id="game"><div class="count" id="count"></div><div class="picture" id="picture"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="action alt" id="listen">🔊 استمع للسؤال</button><button class="action" id="next" disabled>التالي ←</button></div><div class="small">اختر الإجابة الصحيحة. يمكنك المحاولة مرة أخرى.</div></section>
<section class="finish hide" id="finish"><div class="stars">⭐ ⭐ ⭐</div><h2 style="font-size:30px;color:#24855f">أحسنت!</h2><p style="font-size:23px">نتيجتك: <strong id="score"></strong></p><button class="action" id="again">🔄 العب مرة أخرى</button></section>
</main><script>
const data={"file": "01_ميز_الشكل_المركب.html", "title": "من أجزاء إلى شكل جميل", "subtitle": "هل تستطيع تمييز الشكل المركب؟", "intro": "الشكل المركب يتكوّن من شكلين أو أكثر. انظر جيدًا ثم اختر.", "kind": "identify", "items": [{"pic": "house", "q": "أي صورة تتكوّن من أكثر من شكل هندسي؟", "opts": [["دائرة", "circle"], ["منزل", "house"], ["مربع", "square"]], "a": 1}, {"pic": "rocket", "q": "أي صورة تتكوّن من أشكال هندسية مختلفة؟", "opts": [["مثلث", "triangle"], ["صاروخ", "rocket"], ["دائرة", "circle"]], "a": 1}, {"pic": "boat", "q": "اختر الشكل المركب.", "opts": [["قارب", "boat"], ["مستطيل", "rectangle"], ["دائرة", "circle"]], "a": 0}, {"pic": "robot", "q": "أي صورة تتكوّن من عدة أجزاء هندسية؟", "opts": [["مربع", "square"], ["روبوت", "robot"], ["مثلث", "triangle"]], "a": 1}]};
let index=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.9;speechSynthesis.speak(u)}
function art(key){const arts={"house": "<svg viewBox=\"0 0 160 130\" role=\"img\" aria-label=\"منزل\"><polygon points=\"20,58 80,10 140,58\" fill=\"#ff9f43\" stroke=\"#27364b\" stroke-width=\"5\"/><rect x=\"32\" y=\"57\" width=\"96\" height=\"65\" rx=\"3\" fill=\"#72c7ef\" stroke=\"#27364b\" stroke-width=\"5\"/><rect x=\"68\" y=\"82\" width=\"25\" height=\"40\" fill=\"#9b6845\" stroke=\"#27364b\" stroke-width=\"4\"/><rect x=\"43\" y=\"70\" width=\"18\" height=\"18\" fill=\"#fff4b8\" stroke=\"#27364b\" stroke-width=\"3\"/><rect x=\"101\" y=\"70\" width=\"18\" height=\"18\" fill=\"#fff4b8\" stroke=\"#27364b\" stroke-width=\"3\"/></svg>", "rocket": "<svg viewBox=\"0 0 160 140\" role=\"img\" aria-label=\"صاروخ\"><path d=\"M80 8 Q120 42 105 100 L55 100 Q40 42 80 8Z\" fill=\"#f16b6b\" stroke=\"#27364b\" stroke-width=\"5\"/><circle cx=\"80\" cy=\"54\" r=\"12\" fill=\"#bcecff\" stroke=\"#27364b\" stroke-width=\"4\"/><path d=\"M55 82 L28 112 L57 105 M105 82 L132 112 L103 105\" fill=\"#ffbf47\" stroke=\"#27364b\" stroke-width=\"5\"/><path d=\"M68 101 L80 133 L92 101\" fill=\"#6ccf9a\" stroke=\"#27364b\" stroke-width=\"4\"/></svg>", "tree": "<svg viewBox=\"0 0 160 140\" role=\"img\" aria-label=\"شجرة\"><rect x=\"68\" y=\"76\" width=\"25\" height=\"55\" fill=\"#a96d42\" stroke=\"#27364b\" stroke-width=\"4\"/><circle cx=\"80\" cy=\"42\" r=\"34\" fill=\"#64c985\" stroke=\"#27364b\" stroke-width=\"4\"/><circle cx=\"52\" cy=\"65\" r=\"23\" fill=\"#7bdc91\" stroke=\"#27364b\" stroke-width=\"4\"/><circle cx=\"108\" cy=\"65\" r=\"23\" fill=\"#7bdc91\" stroke=\"#27364b\" stroke-width=\"4\"/></svg>", "boat": "<svg viewBox=\"0 0 160 130\" role=\"img\" aria-label=\"قارب\"><path d=\"M18 78 H142 L116 112 H45Z\" fill=\"#ffbd4a\" stroke=\"#27364b\" stroke-width=\"5\"/><rect x=\"77\" y=\"22\" width=\"5\" height=\"57\" fill=\"#27364b\"/><path d=\"M73 26 L35 72 H73Z\" fill=\"#72c7ef\" stroke=\"#27364b\" stroke-width=\"4\"/><path d=\"M87 32 L125 72 H87Z\" fill=\"#f28e8e\" stroke=\"#27364b\" stroke-width=\"4\"/></svg>", "robot": "<svg viewBox=\"0 0 160 140\" role=\"img\" aria-label=\"روبوت\"><rect x=\"42\" y=\"38\" width=\"76\" height=\"57\" rx=\"10\" fill=\"#83c9ed\" stroke=\"#27364b\" stroke-width=\"5\"/><rect x=\"57\" y=\"12\" width=\"46\" height=\"26\" rx=\"6\" fill=\"#ffbd4a\" stroke=\"#27364b\" stroke-width=\"4\"/><circle cx=\"65\" cy=\"62\" r=\"7\" fill=\"#27364b\"/><circle cx=\"97\" cy=\"62\" r=\"7\" fill=\"#27364b\"/><path d=\"M65 80 Q80 91 95 80\" fill=\"none\" stroke=\"#27364b\" stroke-width=\"4\"/><rect x=\"20\" y=\"50\" width=\"22\" height=\"12\" rx=\"5\" fill=\"#f28e8e\"/><rect x=\"118\" y=\"50\" width=\"22\" height=\"12\" rx=\"5\" fill=\"#f28e8e\"/><rect x=\"54\" y=\"96\" width=\"17\" height=\"32\" fill=\"#83c9ed\" stroke=\"#27364b\" stroke-width=\"4\"/><rect x=\"89\" y=\"96\" width=\"17\" height=\"32\" fill=\"#83c9ed\" stroke=\"#27364b\" stroke-width=\"4\"/></svg>", "square": "<svg viewBox=\"0 0 120 120\"><rect x=\"18\" y=\"18\" width=\"84\" height=\"84\" rx=\"4\" fill=\"#72c7ef\" stroke=\"#27364b\" stroke-width=\"5\"/></svg>", "triangle": "<svg viewBox=\"0 0 120 120\"><polygon points=\"60,12 108,103 12,103\" fill=\"#ff9f43\" stroke=\"#27364b\" stroke-width=\"5\"/></svg>", "circle": "<svg viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"#79d49a\" stroke=\"#27364b\" stroke-width=\"5\"/></svg>", "rectangle": "<svg viewBox=\"0 0 140 100\"><rect x=\"12\" y=\"18\" width=\"116\" height=\"64\" rx=\"4\" fill=\"#f28e8e\" stroke=\"#27364b\" stroke-width=\"5\"/></svg>"};return arts[key]||''}
function render(){
 locked=false;const item=data.items[index];$('count').textContent=`السؤال ${index+1} من ${data.items.length}`;$('bar').style.width=(index/data.items.length*100)+'%';
 $('feedback').textContent='';$('next').disabled=true;
 if(data.kind==='choose'){$('picture').innerHTML='<div class="emoji">'+item.pic+'</div>'}
 else {$('picture').innerHTML=art(item.pic)}
 $('question').textContent=item.q;$('options').innerHTML='';
 item.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';
   if(data.kind==='identify'||data.kind==='match'){b.innerHTML=art(o[1])+'<span class="label">'+o[0]+'</span>'}
   else {b.innerHTML='<span class="label">'+o[0]+'</span>'}
   b.onclick=()=>answer(i,b);$('options').appendChild(b);
 });
}
function answer(i,btn){
 if(locked)return;const item=data.items[index];const buttons=[...document.querySelectorAll('.opt')];
 if(i===item.a){locked=true;score++;buttons.forEach((b,n)=>{b.disabled=true;if(n===item.a)b.classList.add('good')});$('feedback').textContent='ممتاز';$('feedback').style.color='#24855f';$('next').disabled=false;say('ممتاز');}
 else{btn.classList.add('bad');btn.disabled=true;$('feedback').textContent='حاول مرة أخرى';$('feedback').style.color='#b47722';say('حاول مرة أخرى');}
}
function next(){index++;if(index<data.items.length)render();else finish()}
function finish(){$('game').classList.add('hide');$('finish').classList.remove('hide');$('bar').style.width='100%';$('score').textContent=`${score} من ${data.items.length}`;say('ممتاز')}
$('next').onclick=next;$('listen').onclick=()=>say(data.items[index].q);
$('again').onclick=()=>{index=0;score=0;$('finish').classList.add('hide');$('game').classList.remove('hide');render()};
$('title').textContent=data.title;$('subtitle').textContent=data.subtitle;$('intro').textContent=data.intro;render();
</script></body></html>
