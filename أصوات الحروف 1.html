
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسمع واختر الحرف</title>
<style>
body{font-family:Tahoma,Arial;background:#eaf5ff;text-align:center;margin:0;padding:20px}
.card{max-width:650px;margin:20px auto;background:white;border-radius:25px;padding:25px;box-shadow:0 5px 18px #0002}
h1{color:#2765aa;font-size:30px}
p{font-size:22px}
button{font-size:27px;padding:15px 25px;border:0;border-radius:18px;cursor:pointer;margin:10px}
.sound{background:#ffca55;color:#533900}
.options{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:25px}
.option{background:#e3efff;color:#20599c;min-width:90px;font-size:55px;border:3px solid #b8d4f5}
button:active{transform:scale(.95)}
#feedback{font-size:25px;font-weight:bold;min-height:40px}
.good{color:#159568}.bad{color:#e16b50}
</style>
</head>
<body>
<div class="card">
<h1>🎧 اسمع واختر الحرف</h1>
<p>اضغط على السماعة واستمع جيدًا، ثم اختر الحرف الذي سمعته.</p>
<button class="sound" onclick="listen()">🔊 اسمع الحرف</button>
<div class="options" id="options"></div>
<div id="feedback"></div>
<p id="progress"></p>
<button class="sound" id="next" onclick="next()" hidden>السؤال التالي ➡️</button>
</div>

<script>
const questions=[
{letter:"ب",sound:"باء"},
{letter:"م",sound:"ميم"},
{letter:"س",sound:"سين"},
{letter:"ت",sound:"تاء"},
{letter:"ر",sound:"راء"}
];
let index=0,answered=false;

function listen(){
let speech=new SpeechSynthesisUtterance(questions[index].sound);
speech.lang="ar-SA";
speech.rate=0.7;
speechSynthesis.cancel();
speechSynthesis.speak(speech);
}

function show(){
answered=false;
document.getElementById("feedback").textContent="";
document.getElementById("next").hidden=true;
document.getElementById("progress").textContent=
"السؤال "+(index+1)+" من "+questions.length;

let choices=[questions[index].letter];
while(choices.length<3){
let random=questions[Math.floor(Math.random()*questions.length)].letter;
if(!choices.includes(random)) choices.push(random);
}
choices.sort(()=>Math.random()-.5);

document.getElementById("options").innerHTML="";
choices.forEach(letter=>{
let b=document.createElement("button");
b.className="option";
b.textContent=letter;
b.onclick=()=>check(letter);
document.getElementById("options").appendChild(b);
});
}

function check(letter){
if(answered)return;
answered=true;
let f=document.getElementById("feedback");
if(letter===questions[index].letter){
f.textContent="🌟 أحسنت! إجابة صحيحة";
f.className="good";
}else{
f.textContent="👏 محاولة جميلة! الحرف الصحيح هو "+questions[index].letter;
f.className="bad";
}
document.getElementById("next").hidden=false;
}

function next(){
index++;
if(index>=questions.length){
document.querySelector(".card").innerHTML=
"<h1>🏆 رائع يا بطل!</h1><p>لقد تعرفت على أصوات الحروف.</p><div style='font-size:75px'>🌟🎉🌟</div><button class='sound' onclick='location.reload()'>العب مرة أخرى</button>";
}else show();
}
show();
</script>
</body>
</html>
