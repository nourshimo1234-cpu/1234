<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>أكمل مجموعة الخمسة</title>
<style>
:root{--blue:#4f8edc;--green:#55b98a;--pink:#ffb6c8;--gold:#ffd166;--ink:#263238}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#eef6ff,#fff5f8);font-family:Tahoma,Arial,sans-serif;color:var(--ink);direction:rtl}
main{max-width:860px;margin:auto;padding:16px}
header,.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 24px #3453;margin-bottom:16px}
h1{font-size:clamp(25px,5vw,36px);color:#315b9b;margin:5px 0 10px}
p{font-size:clamp(18px,3vw,22px);line-height:1.7;margin:8px 0}
.small{font-size:16px;color:#64748b}
.big{font-size:clamp(95px,22vw,160px);font-weight:900;color:#477ed1;line-height:1.1}
button,.choice,.drop{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:15px 20px;font-size:clamp(20px,4vw,27px);font-weight:bold}
button{background:var(--blue);color:white;box-shadow:0 5px 0 #3268ae}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #3268ae}
button.pink{background:var(--pink);box-shadow:0 5px 0 #df829c;color:#542b3b}
button.green{background:var(--green);box-shadow:0 5px 0 #33845e}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.choice{background:#f0f6ff;border:4px solid #d5e5ff;color:#315b9b;min-height:94px}
.choice:focus,button:focus{outline:4px solid var(--gold);outline-offset:3px}
.choice.correct{background:#e2f8eb;border-color:var(--green)}
.choice.wrong{background:#fff0f0;border-color:#ff9b9b}
.feedback{font-size:23px;font-weight:bold;min-height:48px;text-align:center;color:#25845a;margin:12px}
.objects{font-size:clamp(34px,8vw,57px);line-height:1.7;letter-spacing:3px;min-height:100px}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.piece{display:inline-block;background:#eaf2ff;color:#315b9b;border:3px solid #b9d2fa;border-radius:18px;padding:12px 24px;font-size:38px;font-weight:bold;cursor:grab;touch-action:manipulation}
.drop{min-width:140px;min-height:88px;background:#fff9e8;border:3px dashed #e9b94f;color:#805c14}
.hidden{display:none!important}
footer{text-align:center;color:#64748b;padding:10px;font-size:14px}
@media(max-width:520px){main{padding:10px}.grid{gap:9px}.choice{padding:12px}}
</style></head><body><main>
<header><div class="small">رحلة الأرقام الممتعة • الجلسة ٢٠</div><h1>أكمل مجموعة الخمسة</h1>
<p>مرحبًا يا بطل! 🌟 هيا نلعب ونتعلم. يمكنك الضغط على زر الصوت لسماع التعليمات.</p></header>

<section class="panel" style="text-align:center">
<p>اسحب الرقم ٥ إلى مجموعة الأشياء التي عددها خمسة، أو اضغط على الرقم ثم على المكان المناسب.</p>
<div class="row"><span class="piece" draggable="true" id="five" onclick="choose()">٥</span><button onclick="help()">🔊 مساعدة</button></div>
</section>
<section class="panel">
<div class="grid">
<div style="text-align:center"><div class="objects">🍋 🍋 🍋 🍋 🍋</div><div class="drop" data-ok="yes" onclick="put(this)">ضع الرقم هنا</div></div>
<div style="text-align:center"><div class="objects">🍉 🍉 🍉</div><div class="drop" data-ok="no" onclick="put(this)">ضع الرقم هنا</div></div>
</div><div class="feedback" id="feedback" aria-live="polite"></div>
<div class="row"><button class="green" onclick="resetGame()">ابدأ من جديد</button></div>
</section>
<footer>أنت رائع! استمر في المحاولة 💛</footer></main><script>
let selected=false,done=false;const piece=document.getElementById('five');
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u)}}
function choose(){if(done)return;selected=true;piece.style.outline='4px solid #ffd166';document.getElementById('feedback').textContent='الآن اختر مجموعة الصور المناسبة.'}
function help(){say('عدّ الصور. المجموعة التي فيها خمسة أشياء هي المجموعة الصحيحة.')}
function put(zone){if(done)return;if(!selected){document.getElementById('feedback').textContent='اضغط على الرقم خمسة أولًا.';return}if(zone.dataset.ok==='yes'){done=true;zone.textContent='✓ ٥';zone.style.border='3px solid #55b98a';zone.style.background='#e2f8eb';piece.style.visibility='hidden';document.getElementById('feedback').textContent='👏 أحسنت! ربطت الرقم خمسة بالكمية الصحيحة.';say('أحسنت! خمسة أشياء.')}else{document.getElementById('feedback').textContent='حاول مرة أخرى. عدّ الأشياء.';say('حاول مرة أخرى. عد الأشياء.')}}
piece.addEventListener('dragstart',e=>{selected=true;e.dataTransfer.setData('text/plain','٥')});
document.querySelectorAll('.drop').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();selected=true;put(z)})});
function resetGame(){selected=false;done=false;piece.style.visibility='visible';piece.style.outline='none';document.querySelectorAll('.drop').forEach(z=>{z.textContent='ضع الرقم هنا';z.style.border='3px dashed #e9b94f';z.style.background='#fff9e8'});document.getElementById('feedback').textContent=''}
</script></body></html>
