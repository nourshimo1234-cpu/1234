<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أشياء خضراء حولي</title>
<style>
:root{
  --green:#159447; --green-dark:#087436; --green-light:#eaf8ef;
  --green-mid:#bfe8cc; --ink:#173b2a; --line:#d6ecdd;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Tahoma,Arial,sans-serif}
main{max-width:1050px;margin:auto;padding:18px 24px 28px;text-align:center}
h1{font-size:clamp(28px,4vw,44px);color:#147c3b;margin:8px 0 22px;font-weight:800}
h1 .emoji{font-size:.9em;margin-right:10px}
.instruction{font-size:clamp(17px,2.2vw,23px);margin:0 auto 26px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:920px;margin:0 auto 20px}
.item{
  appearance:none;border:3px solid var(--line);border-radius:22px;background:#fbfffc;
  min-height:185px;padding:15px 10px 12px;cursor:pointer;
  box-shadow:0 5px 0 #e2f0e6;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;transition:.18s transform,.18s border-color,.18s background;
  color:#111;font:inherit
}
.item:hover{transform:translateY(-3px);border-color:#7bc994}
.item:focus-visible{outline:4px solid #8ed6a5;outline-offset:3px}
.item.selected{background:#e6f7eb;border-color:var(--green);box-shadow:0 5px 0 #c8e9d1}
.item svg{width:min(100%,145px);height:112px;overflow:visible}
.item strong{font-size:23px;color:#111}
.teacher{
  border:2px dashed #7bc994;border-radius:8px;background:#eef9f1;
  padding:17px 16px 20px;margin:18px -24px 18px;
}
.teacher h2{font-size:22px;margin:0 0 12px;color:#155b31}
.teacher p{font-size:clamp(18px,2.2vw,23px);line-height:1.8;margin:0}
.feedback{font-size:clamp(22px,2.8vw,28px);font-weight:800;color:#168347;min-height:42px;margin:16px 0 24px}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button.action{border:0;border-radius:18px;padding:15px 26px;font-size:20px;font-weight:800;cursor:pointer}
.primary{background:#18864a;color:#fff}
.secondary{background:#edf3ef;color:#315340}
button.action:hover{filter:brightness(.96)}
button.action:focus-visible{outline:4px solid #a5dcb5;outline-offset:3px}
@media(max-width:620px){
 main{padding:14px 12px 24px}.grid{gap:10px}
 .item{min-height:145px;padding:10px 5px;border-radius:16px}
 .item svg{height:82px;width:100%}.item strong{font-size:18px}
 .teacher{margin:14px -12px;padding:14px 10px}
 button.action{font-size:17px;padding:13px 19px}
}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
  <h1><span class="emoji">🐻</span> أشياء خضراء حولي</h1>
  <p class="instruction">اضغط على الصورة، واستمع إلى اسم الشيء، ثم قل: هذا أخضر أو هذه خضراء.</p>

  <section class="grid" aria-label="صور أشياء خضراء">
    <button class="item" data-name="كوب" data-sentence="هذا كوب أخضر" aria-label="كوب أخضر">
      <svg viewBox="0 0 150 112" role="img" aria-label="رسم كوب أخضر">
        <path d="M27 20h78l-8 78H37z" fill="#20a653" stroke="#087436" stroke-width="5"/>
        <path d="M105 32h17c19 0 18 34-2 39l-22 4" fill="none" stroke="#087436" stroke-width="10" stroke-linecap="round"/>
        <path d="M40 31h57" stroke="#a8e8bc" stroke-width="5"/>
      </svg><strong>كوب</strong>
    </button>
    <button class="item" data-name="مكعب" data-sentence="هذا مكعب أخضر" aria-label="مكعب أخضر">
      <svg viewBox="0 0 150 112" role="img" aria-label="رسم مكعب أخضر">
        <path d="M75 8 132 37 75 67 18 37z" fill="#72d895" stroke="#087436" stroke-width="4"/>
        <path d="M18 37 75 67v38L18 76z" fill="#20a653" stroke="#087436" stroke-width="4"/>
        <path d="M132 37 75 67v38l57-29z" fill="#128440" stroke="#087436" stroke-width="4"/>
      </svg><strong>مكعب</strong>
    </button>
    <button class="item" data-name="كرة" data-sentence="هذه كرة خضراء" aria-label="كرة خضراء">
      <svg viewBox="0 0 150 112" role="img" aria-label="رسم كرة خضراء">
        <circle cx="75" cy="55" r="44" fill="#20a653" stroke="#087436" stroke-width="5"/>
        <path d="M37 31q38 27 76 0M37 79q38-27 76 0" fill="none" stroke="#b9f0ca" stroke-width="5"/>
      </svg><strong>كرة</strong>
    </button>
    <button class="item" data-name="قلم" data-sentence="هذا قلم أخضر" aria-label="قلم أخضر">
      <svg viewBox="0 0 150 112" role="img" aria-label="رسم قلم أخضر">
        <g transform="rotate(43 75 55)">
          <rect x="54" y="10" width="42" height="78" rx="7" fill="#20a653" stroke="#087436" stroke-width="4"/>
          <rect x="54" y="10" width="42" height="19" rx="6" fill="#9de4b2" stroke="#087436" stroke-width="3"/>
          <path d="M54 88h42L75 111z" fill="#f5d6a7" stroke="#875b2d" stroke-width="2"/>
        </g>
      </svg><strong>قلم</strong>
    </button>
    <button class="item" data-name="قميص" data-sentence="هذا قميص أخضر" aria-label="قميص أخضر">
      <svg viewBox="0 0 150 112" role="img" aria-label="رسم قميص أخضر">
        <path d="M48 18 25 30 7 55l20 15 13-15v47h70V55l13 15 20-15-18-25-23-12q-7 17-22 17T48 18z" fill="#20a653" stroke="#087436" stroke-width="4"/>
        <path d="M48 18q8 17 27 17t27-17" fill="none" stroke="#087436" stroke-width="4"/>
      </svg><strong>قميص</strong>
    </button>
    <button class="item" data-name="سيارة" data-sentence="هذه سيارة خضراء" aria-label="سيارة خضراء">
      <svg viewBox="0 0 150 112" role="img" aria-label="رسم سيارة خضراء">
        <path d="M20 69 29 43q4-12 17-12h57q11 0 17 12l10 15q9 5 9 17v10H11V75q0-5 9-6z" fill="#20a653" stroke="#087436" stroke-width="4"/>
        <path d="m39 43-9 20h39V35H49q-6 0-10 8zm38-8v28h42l-9-20q-3-8-12-8z" fill="#c9f1d4" stroke="#087436" stroke-width="3"/>
        <circle cx="39" cy="86" r="12" fill="#263b31"/><circle cx="115" cy="86" r="12" fill="#263b31"/>
      </svg><strong>سيارة</strong>
    </button>
  </section>

  <section class="teacher" aria-live="polite">
    <h2>سؤال المعلمة:</h2>
    <p id="prompt">اضغط على صورة، ثم قل اسم الشيء ولونه.</p>
  </section>
  <div class="feedback" id="feedback" aria-live="polite">هيا نتعرف على الأشياء الخضراء!</div>
  <div class="actions">
    <button class="action primary" id="listen">اسمع السؤال</button>
    <button class="action secondary" id="reset">ابدأ من جديد</button>
  </div>
</main>
<script>
const cards=[...document.querySelectorAll('.item')];
const prompt=document.getElementById('prompt');
const feedback=document.getElementById('feedback');
function speak(text){
  if(!('speechSynthesis' in window)){feedback.textContent='يمكنك قراءة السؤال بصوت واضح.';return;}
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='ar-EG'; utterance.rate=.88;
  window.speechSynthesis.speak(utterance);
}
cards.forEach(card=>card.addEventListener('click',()=>{
  cards.forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  const name=card.dataset.name, sentence=card.dataset.sentence;
  prompt.textContent=`ما اسم هذا الشيء؟ وما لونه؟`;
  feedback.textContent=sentence+' 🌟';
  speak(`ما اسم هذا الشيء؟ ${name}. أحسنت! ${sentence}.`);
}));
document.getElementById('listen').addEventListener('click',()=>{
  speak('اضغط على صورة، ثم قل اسم الشيء ولونه. هل هو أخضر أم خضراء؟');
});
document.getElementById('reset').addEventListener('click',()=>{
  cards.forEach(c=>c.classList.remove('selected'));
  prompt.textContent='اضغط على صورة، ثم قل اسم الشيء ولونه.';
  feedback.textContent='هيا نتعرف على الأشياء الخضراء!';
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
});
</script>
</body>
</html>
