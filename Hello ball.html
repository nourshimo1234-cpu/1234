
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff3dc">
<title>الكرة الترحيبية</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fff7e8,#e9f7ff);color:#26334a;min-height:100vh;display:grid;place-items:center;padding:16px}
main{width:min(900px,100%);background:#fff;border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 35px #304b681c;text-align:center;border:3px solid #fff}
h1{font-size:clamp(25px,4vw,36px);margin:5px 0 10px;color:#304b75} .sub{font-size:clamp(16px,2.5vw,20px);line-height:1.8;margin:0 auto 20px;max-width:680px}
button,input{font:inherit} button{border:0;border-radius:18px;padding:14px 20px;min-height:56px;background:#5b9de5;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #3675b8;transition:.15s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #3675b8} button:focus-visible,input:focus-visible{outline:4px solid #ffc857;outline-offset:3px}
input{width:min(420px,100%);padding:16px;border:2px solid #b9d7f4;border-radius:16px;text-align:center;font-size:20px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0} .choice{background:#fff0c9;color:#60451b;box-shadow:0 4px 0 #e4bd68} .choice.selected{outline:4px solid #5b9de5;background:#e8f4ff}
.feedback{min-height:56px;margin:18px 0 4px;font-size:21px;font-weight:bold;color:#24835b} .big{font-size:clamp(65px,13vw,110px);line-height:1.2}
.small{font-size:14px;color:#65748b;margin-top:16px} .stars{font-size:30px;letter-spacing:8px}
@media(max-width:520px){main{border-radius:20px}button{padding:12px 15px}}
</style></head><body><main>

<h1>⚽ الكرة الترحيبية</h1>
<p class="sub">أهلاً يا بطل! هيا نتعرف على بعض. اكتب اسمك، ثم اختر شيئاً تحب أن تفعله.</p>
<div class="big" aria-hidden="true">🏀</div>
<div class="row"><input id="kidname" maxlength="18" placeholder="اكتب اسمك هنا" aria-label="اسم الطفل"></div>
<p class="sub">ماذا تحب أن تفعل؟</p>
<div class="row" id="hobbies">
<button class="choice" data-label="الرسم">🎨 أرسم</button>
<button class="choice" data-label="اللعب بالكرة">⚽ ألعب بالكرة</button>
<button class="choice" data-label="الغناء">🎵 أغني</button>
<button class="choice" data-label="تركيب المكعبات">🧱 أركب المكعبات</button>
</div>
<div class="row"><button id="send">أرسل الكرة للمعلمة 🏀</button></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="small">يمكن للطفل الإجابة بصوته أيضاً، بمساعدة المعلمة.</div>
<script>
let hobby='';
document.querySelectorAll('#hobbies button').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('#hobbies button').forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected'); hobby=b.dataset.label; say('اختيار جميل! '+hobby);
}));
document.getElementById('send').addEventListener('click',()=>{
 const n=document.getElementById('kidname').value.trim();
 if(!n){document.getElementById('feedback').textContent='اكتب اسمك الجميل أولاً 😊';say('ما اسمك يا بطل؟');return;}
 if(!hobby){document.getElementById('feedback').textContent='اختر شيئاً تحب أن تفعله 😊';say('اختر ما تحب أن تفعله');return;}
 document.getElementById('feedback').textContent='أهلاً يا '+n+'! سعداء بلقائك 💛';
 say('أهلاً يا '+n+'! سعيدون بلقائك. أنت تحب '+hobby+'. هيا نلعب معاً!');
});
</script>

</main>
<script>
function say(t){try{if(!('speechSynthesis' in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.88;u.pitch=1.08;speechSynthesis.speak(u)}catch(e){}}
function praise(){document.getElementById('feedback').textContent='أحسنت! أنت رائع ⭐';say('أحسنت! أنت رائع')} 
</script></body></html>
