<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصص الطرح الممتعة</title>
<style>
body{font-family:Tahoma;background:#fff8df;text-align:center;padding:15px;color:#58472d}
.box{max-width:680px;margin:auto;background:white;padding:22px;border-radius:25px;box-shadow:0 4px 15px #ddd}
h1{color:#e39b30;font-size:29px}
.story{font-size:24px;line-height:1.8;background:#fff1c7;padding:18px;border-radius:20px}
.picture{font-size:53px;margin:20px;line-height:1.8}
.equation{font-size:38px;color:#287db5;font-weight:bold}
.answers button{font-size:27px;padding:14px 28px;margin:8px;border:0;border-radius:17px;background:#c9edcc;cursor:pointer}
.feedback{font-size:23px;min-height:65px;color:#24834a}
.control{font-size:20px;padding:12px 20px;margin:7px;border:0;border-radius:15px;background:#ffdc8c;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>📖 قصص الطرح الممتعة</h1>
<p style="font-size:21px">استمع إلى القصة، وانظر إلى الصور، ثم أجب.</p>

<div class="story" id="story"></div>
<div class="picture" id="picture"></div>
<div class="equation" id="equation"></div>

<p style="font-size:22px">كم بقي؟</p>
<div class="answers" id="answers"></div>

<div class="feedback" id="feedback">هيا نساعد أصدقاءنا! ⭐</div>

<button class="control" onclick="listen()">🔊 استمع للقصة</button>
<button class="control" onclick="hint()">💡 مساعدة</button>
<button class="control" onclick="next()">القصة التالية ➜</button>

<p id="score">النجوم: 0 ⭐</p>
</div>

<script>
const stories=[
{
text:"كان مع سارة 3 بالونات 🎈، طار منها بالون واحد إلى السماء. كم بالونًا بقي معها؟",
emoji:"🎈",a:3,b:1
},
{
text:"كان لدى أحمد 4 تفاحات 🍎، أكل تفاحتين. كم تفاحة بقيت؟",
emoji:"🍎",a:4,b:2
},
{
text:"كان في الحديقة 3 فراشات 🦋، طارت فراشة واحدة. كم فراشة بقيت؟",
emoji:"🦋",a:3,b:1
},
{
text:"لدى مريم 5 حلوى 🍬، أعطت صديقتها قطعتين. كم قطعة بقيت معها؟",
emoji:"🍬",a:5,b:2
},
{
text:"كان في البركة 4 أسماك 🐟، سبحت سمكتان بعيدًا. كم سمكة بقيت؟",
emoji:"🐟",a:4,b:2
},
{
text:"على الشجرة 5 عصافير 🐦، طار منها 3 عصافير. كم عصفورًا بقي؟",
emoji:"🐦",a:5,b:3
}
];

let i=0,score=0,done=false;

function show(){
 done=false;
 let q=stories[i],c=q.a-q.b;
 document.getElementById("story").textContent=q.text;
 document.getElementById("picture").textContent=
 q.emoji.repeat(q.a)+" ➖ "+q.emoji.repeat(q.b);
 document.getElementById("equation").textContent=q.a+" - "+q.b+" = ؟";
 document.getElementById("feedback").textContent="فكر وعدّ ما تبقى!";
 let options=[c,c+1,Math.max(0,c-1)];
 options=[...new Set(options)];
 while(options.length<3)options.push(c+2);
 options=options.slice(0,3).sort(()=>Math.random()-.5);
 document.getElementById("answers").innerHTML="";
 options.forEach(n=>{
 let btn=document.createElement("button");
 btn.textContent=n;
 btn.onclick=()=>check(n,c);
 document.getElementById("answers").appendChild(btn);
 });
}

function check(n,c){
 if(done)return;
 if(n===c){
 done=true;score++;
 document.getElementById("feedback").textContent=
 "🎉 أحسنت! لقد فهمت القصة وحللت المسألة!";
 document.getElementById("score").textContent=
 "النجوم: "+score+" ⭐";
 }else{
 document.getElementById("feedback").textContent=
 "💛 حاول مرة أخرى. عدّ الصور التي بقيت.";
 }
}

function hint(){
 let q=stories[i];
 document.getElementById("feedback").textContent=
 "💡 كان لدينا "+q.a+"، وأخذنا "+q.b+". احذف ما أُخذ ثم عدّ الباقي.";
}

function listen(){
 if("speechSynthesis" in window){
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(stories[i].text);
 u.lang="ar-SA";
 u.rate=.85;
 speechSynthesis.speak(u);
 }
}

function next(){
 i++;
 if(i>=stories.length){
 document.getElementById("story").textContent=
 "🎊 انتهت جميع القصص! أنت بطل الطرح الصغير.";
 document.getElementById("picture").textContent="🏆🌟🎈";
 document.getElementById("equation").textContent="أحسنت!";
 document.getElementById("answers").innerHTML="";
 document.getElementById("feedback").textContent=
 "رائع! حصلت على "+score+" نجمة.";
 speechSynthesis.cancel();
 return;
 }
 show();
}
show();
</script>
</body>
</html>
