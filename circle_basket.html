<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>سلة الأشياء الدائرية</title>
<style>
:root{--ink:#26334a;--purple:#7257c8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4f7ff,#fff9ed);font-family:Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:22px}.top,.panel{background:white;border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 24px #25365b12}
h1{margin:4px 0 8px;color:#5844a5;font-size:clamp(24px,4vw,34px)}.sub,.small{color:#667085}
.progress{height:10px;background:#e8eaf3;border-radius:20px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:linear-gradient(90deg,#6bc6a5,#8b75df);transition:.3s}
.panel{margin-top:18px}.prompt{font-size:clamp(21px,3vw,28px);font-weight:bold;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.tile{border:3px solid #e8eaf3;background:#fbfcff;border-radius:20px;min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;cursor:pointer;font-size:19px;font-weight:bold}
.tile.correct{border-color:#31ad7b;background:#e8fff4}.tile.wrong{border-color:#e17a82;background:#fff0f1}
.tile svg{width:92px;height:92px;max-width:100%}
button{border:0;border-radius:14px;padding:12px 20px;font-size:17px;font-weight:bold;cursor:pointer;background:#7058c8;color:white}
button.secondary{background:#e9e6f8;color:#51418d}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.feedback{font-size:20px;font-weight:bold;min-height:32px;margin-top:15px;color:#25845f}.small{font-size:14px;margin-top:12px}.object{font-size:82px;line-height:1.1}
.word{font-size:28px;color:#5844a5;background:#f0edff;padding:12px 28px;border-radius:18px}
@media(max-width:520px){.wrap{padding:12px}.panel{padding:15px}.tile{min-height:125px}}
</style></head><body><main class="wrap">
<header class="top"><h1>سلة الأشياء الدائرية</h1><div class="sub">النشاط الرابع · ربط الدائرة بأشياء من الحياة</div><div class="progress"><div class="bar" id="bar"></div></div></header>
<section class="panel"><div class="prompt" id="prompt">اختر الأشياء التي تشبه الدائرة وضعها في سلة الدوائر.</div><div class="grid" id="grid"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="secondary" onclick="speakPrompt()">🔊 اسمع التعليمات</button><button onclick="resetGame()">↻ ابدأ من جديد</button></div>
<div class="small">استمع، شاهد، ثم اختر. أحسنت المحاولة!</div></section></main>
<script>
const $=id=>document.getElementById(id);
function say(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.85;speechSynthesis.speak(u)}
function speakPrompt(){say($('prompt').innerText)}
function setProgress(n,total){$('bar').style.width=(n/total*100)+'%'}

const items=[['⚽','كرة',1],['☀️','شمس',1],['🍊','برتقالة',1],['🕰️','ساعة',1],['📦','صندوق',0],['📐','مسطرة',0]];
let n=0;function render(){n=0;$('grid').innerHTML='';[...items].sort(()=>Math.random()-.5).forEach(it=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span class="object">'+it[0]+'</span><span>'+it[1]+'</span>';b.onclick=()=>{if(b.dataset.done)return;if(it[2]){b.dataset.done=1;b.classList.add('correct');n++;$('feedback').textContent='أحسنت! '+it[1]+' من الأشياء الدائرية.';say('أحسنت! '+it[1]+' من الأشياء الدائرية');setProgress(n,4);if(n===4){$('feedback').textContent='ممتاز! امتلأت سلة الدوائر.';say('ممتاز!')}}else{b.classList.add('wrong');$('feedback').textContent='هذا ليس دائريًا. اتركه خارج السلة.';say('هذا ليس دائريًا')}};$('grid').appendChild(b)})}function resetGame(){render();$('feedback').textContent='';setProgress(0,4)}render();
</script></body></html>
