<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختر لونك المفضل</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:linear-gradient(135deg,#fff4df,#e9f7f0);font-family:Tahoma,Arial,sans-serif;color:#26334a}
main{width:min(760px,100%);background:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 30px #253b5520;text-align:center}
h1{color:#315b88;font-size:clamp(26px,5vw,36px);margin:5px}
p{font-size:clamp(17px,3vw,21px);line-height:1.7}
#colors{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:14px;max-width:460px;margin:22px auto}
.color{min-height:86px;border:4px solid white;border-radius:20px;font-size:21px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #0002}
.color:focus-visible,.action:focus-visible{outline:4px solid #333;outline-offset:3px}
.color.selected{outline:5px solid #354d69;transform:scale(1.03)}
#picture{min-height:140px;display:grid;place-items:center}
#picture svg{width:125px;height:125px}
#prompt{font-weight:bold;color:#315b88}
#message{min-height:58px;font-size:21px;font-weight:bold;color:#25845b}
.action{border:0;border-radius:16px;background:#4c94dc;color:white;padding:14px 24px;font-size:18px;font-weight:bold;cursor:pointer}
.note{font-size:14px;color:#68788a}
</style>
</head>
<body>
<main>
<h1>🎨 اختر لونك المفضل</h1>
<p>انظر إلى الألوان. أي لون تحبه أكثر؟ اضغط على اللون الذي تختاره.</p>
<div id="colors">
<button class="color" data-color="الأحمر" data-picture="apple" style="background:#ef5350;color:white">🔴 أحمر</button>
<button class="color" data-color="الأصفر" data-picture="banana" style="background:#ffdc62;color:#493b12">🟡 أصفر</button>
<button class="color" data-color="الأزرق" data-picture="butterfly" style="background:#2196f3;color:white">🔵 أزرق</button>
<button class="color" data-color="الأخضر" data-picture="pear" style="background:#66bb6a;color:white">🟢 أخضر</button>
</div>
<div id="picture" aria-live="polite"><span style="font-size:85px">🌈</span></div>
<p id="prompt">ما لونك المفضل؟</p>
<div id="message" aria-live="polite">اختر لوناً تحبه يا بطل!</div>
<button class="action" id="reset">اختيار لون آخر 🔄</button>
<p class="note">شجّع الطفل على قول: «أنا أحب اللون ...» بصوته.</p>
</main>
<script>
const buttons=[...document.querySelectorAll(".color")];
const picture=document.getElementById("picture");
const promptText=document.getElementById("prompt");
const message=document.getElementById("message");

function femaleArabicVoice(){
 if(!("speechSynthesis" in window)) return null;
 const voices=window.speechSynthesis.getVoices();
 const arabic=voices.filter(v=>/^ar([_-]|$)/i.test(v.lang));
 // Prefer voices commonly identified as female; otherwise use an Arabic voice.
 const female=arabic.find(v=>/female|woman|zira|sara|sahar|laila|leila|amira|mona|hoda|fatima|noura|reem|salma/i.test(v.name));
 return female || arabic.find(v=>/eg/i.test(v.lang)) || arabic[0] || null;
}
function speak(text){
 if(!("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ar-EG";
 utterance.rate=0.78;
 utterance.pitch=1.22;
 utterance.volume=1;
 const voice=femaleArabicVoice();
 if(voice) utterance.voice=voice;
 window.speechSynthesis.speak(utterance);
}
function pictureSvg(kind){
 const common='xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="صورة توضيحية">';
 if(kind==="butterfly"){
  return `<svg ${common}
   <path d="M70 67 C48 20 8 22 18 63 C22 82 48 88 68 76 C45 118 18 119 27 91 C35 73 53 72 70 78 C87 72 105 73 113 91 C122 119 95 118 72 76 C92 88 118 82 122 63 C132 22 92 20 70 67Z" fill="#168BE8" stroke="#0759A8" stroke-width="3"/>
   <ellipse cx="70" cy="76" rx="7" ry="25" fill="#123F78"/>
   <path d="M67 53 Q54 28 43 34 M73 53 Q86 28 97 34" fill="none" stroke="#123F78" stroke-width="3" stroke-linecap="round"/>
   <circle cx="43" cy="55" r="5" fill="#BDE5FF"/><circle cx="97" cy="55" r="5" fill="#BDE5FF"/>
  </svg>`;
 }
 if(kind==="apple") return `<svg ${common}<path d="M70 39 C50 24 20 42 25 76 C30 112 52 124 70 111 C88 124 110 112 115 76 C120 42 90 24 70 39Z" fill="#EF4444" stroke="#B91C1C" stroke-width="3"/><path d="M70 40 Q68 20 78 12" stroke="#75452B" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M75 24 Q99 5 109 25 Q93 40 75 24Z" fill="#39A852"/></svg>`;
 if(kind==="banana") return `<svg ${common}<path d="M24 32 Q50 112 113 80 Q101 119 62 116 Q22 110 13 43Z" fill="#FFD43B" stroke="#D49A00" stroke-width="4"/><path d="M22 32 L15 27 M111 80 L120 77" stroke="#795548" stroke-width="8" stroke-linecap="round"/></svg>`;
 return `<svg ${common}<path d="M70 24 C45 24 30 45 36 75 C41 101 54 119 70 122 C86 119 99 101 104 75 C110 45 95 24 70 24Z" fill="#75C96B" stroke="#328B45" stroke-width="3"/><path d="M70 24 Q67 12 78 8" stroke="#795548" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M76 17 Q100 2 111 20 Q93 34 76 17Z" fill="#26964A"/></svg>`;
}
buttons.forEach(button=>button.addEventListener("click",()=>{
 buttons.forEach(item=>item.classList.remove("selected"));
 button.classList.add("selected");
 const color=button.dataset.color;
 picture.innerHTML=pictureSvg(button.dataset.picture);
 promptText.textContent="قل: أنا أحب اللون "+color;
 message.textContent="أحسنت! اختيارك جميل. ⭐";
 speak("أحسنت يا بطل. اختيارك جميل. أنا أحب اللون "+color+".");
}));
document.getElementById("reset").addEventListener("click",()=>{
 buttons.forEach(item=>item.classList.remove("selected"));
 picture.innerHTML='<span style="font-size:85px">🌈</span>';
 promptText.textContent="ما لونك المفضل؟";
 message.textContent="هيا، اختر لوناً آخر!";
 speak("هيا يا صغيري، اختر لوناً آخر.");
});
if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged=()=>{};
</script>
</body>
</html>
