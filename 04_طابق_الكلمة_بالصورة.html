<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طابق الكلمة بالصورة</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f8ff;color:#29384d;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:1.65}
header{background:#e4f1ff;padding:16px 10px;border-bottom:4px solid #cde3f8}h1{margin:0;font-size:clamp(22px,5vw,31px)}header p{margin:4px 0}
main{max-width:760px;margin:16px auto;padding:0 12px 28px}.card{background:white;border-radius:22px;padding:clamp(14px,3vw,22px);box-shadow:0 5px 20px #23451a12}
.instruction{font-size:clamp(19px,4vw,25px);font-weight:bold;margin:5px 0}.hint{color:#68778a;margin:4px 0 14px}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.choice{min-width:125px;min-height:118px;padding:12px;background:#fff9e8;border:3px solid #eadbb5;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:inherit;font-weight:bold;color:#29384d}
.pic{font-size:55px;line-height:1.2}.word{font-size:26px;color:#3979b8}.choice:focus{outline:4px solid #8cc5f2}
button{border:0;border-radius:13px;padding:11px 18px;margin:5px;background:#3979b8;color:white;font:bold 16px Tahoma;cursor:pointer}
button.secondary{background:#7256a8}.feedback{min-height:52px;margin:12px 0 4px;font-weight:bold;font-size:18px}.good{color:#218451}.retry{color:#ad681b}
.progress{height:10px;background:#e9edf3;border-radius:10px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:#65b98c;transition:width .2s}
.bigpic{font-size:clamp(75px,18vw,115px);background:#eef7ff;border-radius:22px;max-width:220px;margin:12px auto;padding:5px}
.sentence{font-size:clamp(23px,5vw,32px);font-weight:bold;background:#f1f8ff;border-radius:18px;padding:18px;margin:14px 0}
.small{font-size:14px;color:#738096}.choice:disabled{opacity:.55;cursor:default}
@media(max-width:420px){.choice{min-width:105px;min-height:104px}.pic{font-size:46px}.word{font-size:23px}}
</style></head><body><header><h1>طابق الكلمة بالصورة</h1><p>نشاط تفاعلي للمطابقة بالسحب أو اللمس</p></header><main><section class="card"><div class="instruction">صل الكلمة بالصورة المناسبة 🧩</div><p class="hint">المس الكلمة ثم المس الصورة، أو اسحب الكلمة إلى صورتها.</p>
<div class="choices" id="words">
<button class="choice" draggable="true" data-word="تفاحة"><span class="word">تفاحة</span></button>
<button class="choice" draggable="true" data-word="قطة"><span class="word">قطة</span></button>
<button class="choice" draggable="true" data-word="كرة"><span class="word">كرة</span></button>
</div>
<div class="choices" id="pics">
<button class="choice target" data-answer="قطة"><span class="pic">🐱</span><span>الصورة ١</span></button>
<button class="choice target" data-answer="كرة"><span class="pic">⚽</span><span>الصورة ٢</span></button>
<button class="choice target" data-answer="تفاحة"><span class="pic">🍎</span><span>الصورة ٣</span></button>
</div><div class="progress"><span id="bar"></span></div><div id="count">طابقت ٠ من ٣ كلمات</div>
<div class="feedback" id="fb">اختر كلمة ثم ابحث عن صورتها.</div><button id="hear">🔊 استمع إلى الكلمات</button><button class="secondary" id="again">إعادة النشاط ↻</button></section></main><script>
let selected=null,done=new Set();const $=x=>document.getElementById(x);
function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=.8;speechSynthesis.speak(u)}
document.querySelectorAll('[data-word]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.word)});el.onclick=()=>{selected=el.dataset.word;$('fb').textContent='اخترت كلمة '+selected+'، ابحث عن صورتها.';say(selected)}});
document.querySelectorAll('.target').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();match(el,e.dataTransfer.getData('text/plain')||selected)});el.onclick=()=>{if(selected)match(el,selected)}});
function match(el,w){if(!w||done.has(el.dataset.answer))return;if(w===el.dataset.answer){done.add(w);el.style.background='#e6f7ed';el.style.borderColor='#58ad7b';el.disabled=true;document.querySelector(`[data-word="${w}"]`).disabled=true;$('count').textContent=`طابقت ${done.size} من ٣ كلمات`;$('bar').style.width=done.size/3*100+'%';$('fb').textContent='أحسنت! وجدت الصورة المناسبة ⭐';$('fb').className='feedback good';say('أحسنت! '+w);if(done.size===3){$('fb').textContent='ممتاز! طابقت كل الكلمات بصورها.';say('ممتاز!')}}else{$('fb').textContent='ليست الصورة المناسبة. حاول مرة أخرى.';$('fb').className='feedback retry';say('حاول مرة أخرى')}}
$('hear').onclick=()=>say('تفاحة، قطة، كرة.');$('again').onclick=()=>location.reload();
</script></body></html>
