<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهدف 1: التعرف على النباتات</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background: #e8f8f5; color: #2c3e50; margin: 0; padding: 20px; }
    h1 { color: #16a085; font-size: 1.8rem; margin-bottom: 5px; }
    p { font-size: 1.1rem; font-weight: bold; color: #7f8c8d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; max-width: 700px; margin: 20px auto; }
    .card { background: white; border: 4px solid #1abc9c; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card:active { transform: scale(0.95); }
    .icon { font-size: 3.5rem; display: block; }
    .label { font-size: 1.1rem; font-weight: bold; margin-top: 8px; color: #16a085; }
    #result { margin-top: 20px; font-size: 1.3rem; font-weight: bold; color: #0e6251; background: white; padding: 15px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; }
  </style>
</head>
<body>
  <h1>🌱 النشاط الأول: مستكشف النباتات الرائعة 🌳</h1>
  <p>اضغط على النباتات ليتعرف الطفل على أسمائها وأشكالها (مع النطق الصوتي):</p>
  
  <div class="grid">
    <div class="card" onclick="speakAndShow('شجرة خضراء كبيرة', 'تنظف الهواء وتمنحنا الظل الجميل.')">
      <span class="icon">🌳</span><div class="label">شجرة</div>
    </div>
    <div class="card" onclick="speakAndShow('وردة ملونة عطرية', 'تتميز برائحتها الجميلة وألوانها الزاهية.')">
      <span class="icon">🌸</span><div class="label">وردة</div>
    </div>
    <div class="card" onclick="speakAndShow('نخلة باسقة طويلة', 'تعطينا التمر اللذيذ والمفيد.')">
      <span class="icon">🌴</span><div class="label">نخلة</div>
    </div>
    <div class="card" onclick="speakAndShow('تفاحة حمراء لذيذة', 'فاكهة مفيدة تنمو على الأشجار.')">
      <span class="icon">🍎</span><div class="label">تفاح</div>
    </div>
    <div class="card" onclick="speakAndShow('صبار الصحراء', 'نبات قوي يعيش في الصحراء ويتحمل العطش.')">
      <span class="icon">🌵</span><div class="label">صبار</div>
    </div>
    <div class="card" onclick="speakAndShow('جزرة برتقالية مفيدة', 'خضار مفيدة ونبات لذيذ يقوي النظر.')">
      <span class="icon">🥕</span><div class="label">جزر</div>
    </div>
    <div class="card" onclick="speakAndShow('زهرة عباد الشمس', 'تتتبع الشمس طوال اليوم بألوانها الصفراء الرائعة.')">
      <span class="icon">🌻</span><div class="label">عباد الشمس</div>
    </div>
    <div class="card" onclick="speakAndShow('موزة صفراء طرية', 'فاكهة استوائية لذيذة تنمو على أشجار الموز.')">
      <span class="icon">🍌</span><div class="label">موز</div>
    </div>
  </div>

  <div id="result">👆 انقر على أي نبات لتسمع نطقه ومعلوماته!</div>

  <script>
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // إيقاف أي نطق سابق
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA'; // اللغة العربية
        utterance.rate = 0.9; // سرعة مناسبة للأطفال
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakAndShow(name, desc) {
      document.getElementById('result').innerHTML = `🌸 هذا نبات: <span style="color:#d35400;">${name}</span><br><span style="font-size:1rem; color:#555;">💡 معلومة: ${desc}</span>`;
      speakText(name + ". " + desc);
    }
  </script>
</body>
</html>
