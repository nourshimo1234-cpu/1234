<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صائد المستطيلات</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Tahoma,Arial;background:linear-gradient(140deg,#e8f8f4,#f3efff);color:#24324a}.wrap{max-width:980px;margin:auto}.head,.panel{background:white;border-radius:24px;padding:20px;box-shadow:0 7px 22px #203b5018;text-align:center}.head h1{color:#287e71;margin:0 0 8px;font-size:clamp(26px,4vw,38px)}.head p{font-size:19px;margin:0}.prompt{font-size:26px;font-weight:bold;text-align:center;margin:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:3px solid #e8edf2;border-radius:20px;min-height:170px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:pointer;font-size:19px;font-weight:bold}.card:hover{border-color:#72c9b4;transform:translateY(-3px)}.rect{width:116px;height:67px;background:#8a72d6;border-radius:5px}.square{width:78px;height:78px;background:#4e9ee8}.circle{width:80px;height:80px;border-radius:50%;background:#f3ad36}.tri{width:0;height:0;border-left:45px solid transparent;border-right:45px solid transparent;border-bottom:82px solid #ed7791}.msg{min-height:48px;text-align:center;font-size:22px;font-weight:bold;margin:18px}.bar{height:12px;background:#e7edf2;border-radius:20px;overflow:hidden;max-width:450px;margin:15px auto}.fill{height:100%;background:#25ad8a;width:0}.buttons{text-align:center}button{border:0;border-radius:14px;padding:13px 23px;margin:5px;background:#287e71;color:white;font-size:18px;font-weight:bold;cursor:pointer}.light{background:#f0a23a;color:#33250d}.counter{text-align:center;font-size:19px;margin:10px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><header class="head"><h1>🔎 صائد المستطيلات</h1><p>ابحث عن المستطيل بين الأشكال المختلفة.</p></header><div class="bar"><div class="fill" id="fill"></div></div><div class="prompt" id="prompt">اضغط على كل مستطيل تراه!</div><section class="grid" id="grid"></section><div class="msg" id="msg">تذكّر: المستطيل له أربعة أضلاع، وكل ضلعين متقابلين متساويان.</div><div class="counter" id="counter">المستطيلات التي وجدتها: 0</div><div class="buttons"><button onclick="newRound()">جولة جديدة ↻</button><button class="light" onclick="sayHint()">اسمع التلميح 🔊</button></div></main>
<script>
const sets=[
[{t:'باب',s:'rect'},{t:'دائرة',s:'circle'},{t:'مربع',s:'square'},{t:'مثلث',s:'tri'},{t:'كتاب',s:'rect'},{t:'دائرة',s:'circle'},{t:'مستطيل',s:'rect'},{t:'مربع',s:'square'}],
[{t:'نافذة',s:'rect'},{t:'مثلث',s:'tri'},{t:'مربع',s:'square'},{t:'شاشة',s:'rect'},{t:'دائرة',s:'circle'},{t:'مثلث',s:'tri'},{t:'مستطيل',s:'rect'},{t:'مربع',s:'square'}]
];let round=0,found=0,done=new Set();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.85;speechSynthesis.speak(u)}
function draw(){found=0;done.clear();let data=shuffle(sets[round%2]);document.getElementById('grid').innerHTML=data.map((x,i)=>`<button class="card" onclick="pick(${i},'${x.s}')" id="c${i}"><span class="${x.s}"></span><span>${x.t}</span></button>`).join('');document.getElementById('counter').textContent='المستطيلات التي وجدتها: 0';document.getElementById('fill').style.width='0%';document.getElementById('msg').textContent='اضغط على الأشكال المستطيلة فقط.'}
function pick(i,s){if(done.has(i))return;done.add(i);let el=document.getElementById('c'+i);if(s==='rect'){found++;el.style.borderColor='#24ae87';el.style.background='#e9fff6';el.disabled=true;document.getElementById('msg').textContent='أحسنت! وجدت مستطيلاً.';speak('أحسنت! هذا مستطيل.')}else{el.style.borderColor='#f2a14a';document.getElementById('msg').textContent='هذا شكل آخر. ابحث عن شكل طويل له أربعة أضلاع.';speak('هذا ليس مستطيلاً. حاول مرة أخرى.')}document.getElementById('counter').textContent='المستطيلات التي وجدتها: '+found;let total=document.querySelectorAll('.card .rect').length;document.getElementById('fill').style.width=(found/total*100)+'%';if(found===total){document.getElementById('msg').textContent='🏆 رائع! عثرت على كل المستطيلات.';speak('رائع! عثرت على كل المستطيلات.')}}
function newRound(){round++;draw()}function sayHint(){speak('المستطيل له أربعة أضلاع. شكله أطول من المربع غالباً. ابحث عن الباب والكتاب والنافذة.')}draw();
</script></body></html>
