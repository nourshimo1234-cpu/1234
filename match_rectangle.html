<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طابق كلمة مستطيل</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Tahoma,Arial;background:linear-gradient(140deg,#f0edff,#e9f9f3);color:#27354a}.wrap{max-width:900px;margin:auto}.head{background:white;border-radius:24px;padding:20px;text-align:center;box-shadow:0 7px 20px #243d5018}.head h1{margin:0;color:#6854a8;font-size:clamp(26px,4vw,38px)}.head p{font-size:19px}.task{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-top:22px}.target,.choices{background:white;border-radius:22px;padding:20px;box-shadow:0 5px 16px #243d5012;text-align:center}.target h2,.choices h2{margin-top:0}.targetWord{display:inline-block;background:#eee9ff;color:#5d479c;border-radius:15px;padding:16px 30px;font-size:30px;font-weight:bold;margin:20px}.choicesGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:135px;background:#fbfcff;border:3px solid #e5e9ef;border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}.choice:hover{border-color:#9d8bdb}.rect{width:112px;height:65px;background:#8b73d4;border-radius:5px}.square{width:76px;height:76px;background:#4d9ce4}.circle{width:78px;height:78px;border-radius:50%;background:#f3aa35}.tri{width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:80px solid #e76f8c}.msg{text-align:center;font-size:22px;font-weight:bold;min-height:48px;margin:18px}.buttons{text-align:center}button{border:0;border-radius:14px;padding:13px 24px;background:#6854a8;color:white;font-size:18px;font-weight:bold;cursor:pointer}.secondary{background:#e9a23a;color:#33250d;margin-right:8px}.score{text-align:center;font-size:18px;margin:10px}@media(max-width:650px){.task{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="head"><h1>🧩 طابق كلمة «مستطيل»</h1><p>استمع إلى الكلمة، ثم اختر الشكل الصحيح.</p></header><section class="task"><div class="target"><h2>الكلمة المطلوبة</h2><div class="targetWord">مستطيل</div><button onclick="speakWord()">🔊 اسمع الكلمة</button></div><div class="choices"><h2>اختر الصورة المناسبة</h2><div class="choicesGrid" id="grid"></div></div></section><div class="msg" id="msg">أين شكل المستطيل؟</div><div class="score" id="score">الجولة 1 من 3</div><div class="buttons"><button onclick="next()">جولة جديدة ←</button><button class="secondary" onclick="restart()">ابدأ من جديد ↻</button></div></main>
<script>
let round=0,locked=false;const sets=[['rect','circle','square','tri'],['circle','rect','tri','square'],['square','tri','rect','circle']];const labels={rect:'مستطيل',circle:'دائرة',square:'مربع',tri:'مثلث'};
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.85;speechSynthesis.speak(u)}
function speakWord(){speak('مستطيل')}
function draw(){locked=false;document.getElementById('grid').innerHTML=sets[round].map(k=>`<button class="choice" onclick="pick('${k}')"><span class="${k}"></span></button>`).join('');document.getElementById('msg').textContent='اختر شكل المستطيل.';document.getElementById('score').textContent=`الجولة ${round+1} من 3`}
function pick(k){if(locked)return;if(k==='rect'){locked=true;document.getElementById('msg').textContent='🌟 أحسنت! هذه صورة المستطيل.';speak('أحسنت! هذه صورة المستطيل.')}else{document.getElementById('msg').textContent='حاول مرة أخرى. انظر إلى الشكل الطويل.';speak('حاول مرة أخرى. ابحث عن المستطيل.')}}
function next(){if(round<2){round++;draw()}else{document.getElementById('msg').textContent='🎉 رائع! أكملت المطابقة بنجاح.';speak('رائع! أكملت المطابقة بنجاح.');locked=true}}
function restart(){round=0;draw()}draw();
</script></body></html>
