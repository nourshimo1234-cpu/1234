<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهدف 2: التعرف على الحيوانات</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background: #fef5e7; color: #2c3e50; margin: 0; padding: 20px; }
    h1 { color: #d35400; font-size: 1.8rem; margin-bottom: 5px; }
    p { font-size: 1.1rem; font-weight: bold; color: #7f8c8d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; max-width: 700px; margin: 20px auto; }
    .card { background: white; border: 4px solid #e67e22; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card:active { transform: scale(0.95); }
    .icon { font-size: 3.5rem; display: block; }
    .label { font-size: 1.1rem; font-weight: bold; margin-top: 8px; color: #d35400; }
    #result { margin-top: 20px; font-size: 1.3rem; font-weight: bold; color: #ba4a00; background: white; padding: 15px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; }
  </style>
</head>
<body>
  <h1>🦁 النشاط الثاني: مستكشف الحيوانات الأليفة والبرية 🐱</h1>
  <p>اضغط على الحيوانات ليتعرف الطفل على أسمائها (مع النطق الصوتي):</p>
  
  <div class="grid">
    <div class="card" onclick="speakAndShow('الأسد الشجاع', 'ملك الغابة وصوته القوي الزئير.')">
      <span class="icon">🦁</span><div class="label">أسد</div>
    </div>
    <div class="card" onclick="speakAndShow('القطة الأليفة', 'حيوان أليف يحب اللعب وصوته مواء لطيف.')">
      <span class="icon">🐱</span><div class="label">قطة</div>
    </div>
    <div class="card" onclick="speakAndShow('العصفور المغرد', 'يطير في السماء ويغرد بأجمل الألحان.')">
      <span class="icon">🐦</span><div class="label">عصفور</div>
    </div>
    <div class="card" onclick="speakAndShow('الأرنب السريع', 'يتقفز بخفة ويحب أكل الجزر الطازج.')">
      <span class="icon">🐰</span><div class="label">أرنب</div>
    </div>
    <div class="card" onclick="speakAndShow('الفيل الكبير', 'حيوان ضخم له خرطوم طويل وأذنان كبيرتان.')">
      <span class="icon">🐘</span><div class="label">فيل</div>
    </div>
    <div class="card" onclick="speakAndShow('القرد المشاكس', 'يتسلق الأشجار المرتفعة ويحب الموز.')">
      <span class="icon">🐵</span><div class="label">قرد</div>
    </div>
    <div class="card" onclick="speakAndShow('البقرة الطيبة', 'تعطينا الحليب المفيد لصحتنا وقوتنا.')">
      <span class="icon">🐮</span><div class="label">بقرة</div>
    </div>
    <div class="card" onclick="speakAndShow('البطريق الجميل', 'يعيش في الثلج ويمشي بطريقة مضحكة ولطيفة.')">
      <span class="icon">🐧</span><div class="label">بطريق</div>
    </div>
  </div>

  <div id="result">👆 انقر على أي حيوان لتسمع نطقه ومعلوماته!</div>

  <script>
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakAndShow(name, desc) {
      document.getElementById('result').innerHTML = `🐾 هذا حيوان: <span style="color:#16a085;">${name}</span><br><span style="font-size:1rem; color:#555;">💡 معلومة: ${desc}</span>`;
      speakText(name + ". " + desc);
    }
  </script>
</body>
</html>
