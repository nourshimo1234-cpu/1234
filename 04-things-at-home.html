<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اللعبة ٤: أشياء من بيتي</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f8ff;color:#26344b;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:1.6}
header{padding:18px 12px;background:#e4f3ff;border-bottom:4px solid #c9e4f8}
h1{font-size:clamp(1.35rem,5vw,2rem);margin:0} header p{margin:5px 0 0;font-size:1rem}
main{max-width:760px;margin:18px auto;padding:0 12px 28px}
.card{background:white;border-radius:24px;padding:clamp(16px,4vw,28px);box-shadow:0 6px 22px #1e3b5b12}
.prompt{font-size:clamp(1.2rem,4vw,1.7rem);font-weight:bold;margin:8px 0 16px}
.big{font-size:clamp(4rem,16vw,7rem);line-height:1.25;margin:8px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.choice{background:#fff9e9;border:3px solid #f1dfb5;border-radius:20px;min-height:145px;padding:12px 6px;font:inherit;cursor:pointer;color:#26344b}
.choice:focus-visible,button:focus-visible{outline:4px solid #438bd0;outline-offset:3px}
.choice .emoji{display:block;font-size:clamp(3rem,12vw,5rem)}
.choice .name{font-size:1.08rem;font-weight:bold}
button.action{border:0;border-radius:16px;padding:12px 20px;margin:5px;background:#3979b8;color:white;font:inherit;font-weight:bold;cursor:pointer}
button.sound{background:#7256a8} button.secondary{background:#64748b}
.feedback{min-height:58px;font-size:1.15rem;font-weight:bold;margin:10px 0}
.good{color:#208354} .try{color:#b36a19}
.progress{height:12px;background:#e8edf4;border-radius:20px;overflow:hidden;margin:16px 0 8px}
.bar{height:100%;width:0;background:#61b98b;transition:width .25s}
.note{font-size:.9rem;color:#63738a;margin-top:12px}
@media(max-width:420px){.choices{gap:8px}.choice{min-height:125px}}
</style></head>
<body>
<header><h1>اللعبة ٤: أشياء من بيتي</h1><p>استمع إلى الاسم واختر الصورة</p></header>
<main><section class="card">
<div class="prompt" id="prompt">أين الوسادة؟</div>
<div class="big" id="scene">🛏️</div>
<div class="choices" id="choices"></div>
<button class="action sound" onclick="sayCurrent()">🔊 اسمع</button>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="count">١ من ٥</div>
<button class="action" id="next" onclick="next()" disabled>التالي ←</button>
</section>
<p class="note">يمكنك الضغط على زر «اسمع» لسماع السؤال مرة أخرى.</p></main>
<script>
const rounds=[
{q:'أين الوسادة الناعمة؟',a:[['🛏️','وسادة',1],['🪨','حجر',0]]},
{q:'أين الحجر الخشن؟',a:[['🧸','دبدوب',0],['🪨','حجر',1]]},
{q:'أين الوشاح الناعم؟',a:[['🧣','وشاح',1],['🧱','طوبة',0]]},
{q:'أين جذع الشجرة الخشن؟',a:[['🌳','شجرة',1],['☁️','قطن',0]]},
{q:'أين الدبدوب الناعم؟',a:[['🪵','خشب',0],['🧸','دبدوب',1]]}];
let i=0,done=false;
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=.8;speechSynthesis.speak(u)}}
function sayCurrent(){speak(rounds[i].q)}
function render(){document.getElementById('prompt').textContent=rounds[i].q;document.getElementById('choices').innerHTML=rounds[i].a.map((x,j)=>`<button class="choice" onclick="pick(${j})"><span class="emoji">${x[0]}</span><span class="name">${x[1]}</span></button>`).join('');document.getElementById('count').textContent=(i+1)+' من ٥';document.getElementById('bar').style.width=(i/5*100)+'%';document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;done=false;}
function pick(j){if(done)return;if(rounds[i].a[j][2]){done=true;document.getElementById('feedback').textContent='نعم! أحسنت ⭐';document.getElementById('feedback').className='feedback good';document.getElementById('next').disabled=false;speak('نعم! أحسنت.');}else{document.getElementById('feedback').textContent='ليس هذا. استمع مرة أخرى واختر.';document.getElementById('feedback').className='feedback try';speak('ليس هذا. حاول مرة أخرى.');}}
function next(){i++;if(i===rounds.length){document.querySelector('.card').innerHTML='<div class="big">🏅</div><div class="prompt">أحسنت! تعرفت على أشياء من البيت.</div><div class="feedback good">أنت تعرف الناعم والخشن!</div><button class="action" onclick="location.reload()">العب مرة أخرى</button>';speak('أحسنت!');}else render();}
render();setTimeout(()=>sayCurrent(),500);
</script></body></html>
