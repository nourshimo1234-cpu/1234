<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>عدّ واختر الرقم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f8ff;color:#29384d;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:1.65}
header{background:#e4f1ff;padding:16px 10px;border-bottom:4px solid #cde3f8}
h1{margin:0;font-size:clamp(22px,5vw,31px)}
header p{margin:4px 0}
main{max-width:760px;margin:16px auto;padding:0 12px 28px}
.card{background:white;border-radius:22px;padding:clamp(14px,3vw,22px);box-shadow:0 5px 20px #23451a12}
.instruction{font-size:clamp(19px,4vw,25px);font-weight:bold;margin:5px 0}
.hint{color:#68778a;margin:4px 0 14px}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.choice{min-width:125px;min-height:118px;padding:12px;background:#fff9e8;border:3px solid #eadbb5;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:inherit;font-weight:bold;color:#29384d}
.num{font-size:clamp(58px,13vw,82px);line-height:1.1;color:#3979b8;font-weight:bold}
.objects{font-size:clamp(40px,9vw,58px);line-height:1.25;letter-spacing:4px;direction:ltr}
button{border:0;border-radius:13px;padding:11px 18px;margin:5px;background:#3979b8;color:white;font:bold 16px Tahoma;cursor:pointer}
button.secondary{background:#7256a8}
.feedback{min-height:52px;margin:12px 0 4px;font-weight:bold;font-size:18px}
.good{color:#218451}.retry{color:#ad681b}
.progress{height:10px;background:#e9edf3;border-radius:10px;overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;width:0;background:#65b98c;transition:width .2s}
.big-number{font-size:clamp(120px,30vw,190px);line-height:1.2;color:#3979b8;background:#eef7ff;border-radius:22px;max-width:270px;margin:12px auto;padding:4px}
.small{font-size:14px;color:#738096}
.choice:disabled{opacity:.6;cursor:default}
.target{background:#f4f9ff;border-color:#c9dfef}
@media(max-width:420px){.choice{min-width:105px;min-height:104px}}
</style></head><body><header><h1>عدّ واختر الرقم</h1><p>الربط بين الرقم ١ أو ٢ وعدد الأشياء</p></header>
<main><section class="card">
<div class="instruction">عدّ الصور واختر الرقم الصحيح 🧸</div>
<p class="hint">عدّ الأشياء بصوتك: واحد... اثنان... ثم اختر.</p>
<div class="objects" id="items">🍎</div>
<div class="choices" id="opts"></div>
<div class="progress"><span id="bar"></span></div><div id="count">السؤال ١ من ٦</div>
<div class="feedback" id="fb">كم شيئًا ترى؟</div>
<button class="secondary" id="again">إعادة النشاط ↻</button>
</section></main><script>
const qs=[['🍎','١','٢'],['⭐ ⭐','٢','١'],['🐟','١','٢'],['⚽ ⚽','٢','١'],['🌸','١','٢'],['🧸 🧸','٢','١']];
let i=0,lock=false;const $=x=>document.getElementById(x);
function render(){lock=false;$('items').textContent=qs[i][0];$('opts').innerHTML='';
[qs[i][1],qs[i][2]].sort(()=>i%2?1:-1).forEach(n=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${n}</span>`;b.onclick=()=>answer(n);$('opts').appendChild(b)});
$('count').textContent=`السؤال ${'٠١٢٣٤٥٦'[i+1]} من ٦`;$('bar').style.width=i/6*100+'%';$('fb').textContent='عدّ الصور ثم اختر ١ أو ٢.';$('fb').className='feedback'}
function answer(n){if(lock)return;if(n===qs[i][1]){lock=true;$('fb').textContent='أحسنت! عددت الصور بشكل صحيح ⭐';$('fb').className='feedback good';setTimeout(()=>{i++;i<qs.length?render():finish()},1100)}
else{$('fb').textContent='عدّ مرة أخرى ببطء، ثم حاول.';$('fb').className='feedback retry'}}
function finish(){$('bar').style.width='100%';$('count').textContent='اكتمل النشاط';$('opts').textContent='🎉';$('fb').textContent='رائع! ربطت العدد بالرقم المناسب.';$('fb').className='feedback good'}
$('again').onclick=()=>{i=0;render()};render();
</script></body></html>
