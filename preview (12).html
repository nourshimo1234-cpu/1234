<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختفت بعض التفاحات</title>
<style>
body{font-family:Tahoma;background:#fff2e8;text-align:center;padding:15px;color:#593c30}
.box{max-width:650px;margin:auto;background:white;padding:22px;border-radius:25px;box-shadow:0 4px 15px #ddd}
h1{color:#e66a42;font-size:29px}
p{font-size:22px}
.fruits{font-size:48px;line-height:1.8;margin:15px}
.equation{font-size:43px;color:#277db5;font-weight:bold;margin:15px}
button{font-size:25px;padding:14px 24px;margin:7px;border:0;border-radius:17px;background:#ffdf8c;cursor:pointer}
button:hover{background:#ffc95c}
.feedback{font-size:23px;min-height:65px;color:#20844b;font-weight:bold}
.small{font-size:19px;background:#e3f2ff}
</style>
</head>
<body>
<div class="box">
<h1>🍎 اختفت بعض التفاحات 🍎</h1>
<p>انظر إلى التفاحات، لقد أكلنا بعضها!</p>
<div class="fruits" id="fruits"></div>
<div class="equation" id="equation"></div>
<p id="question">كم تفاحة بقيت؟</p>
<div id="answers"></div>
<div class="feedback" id="feedback">هيا نعد التفاحات المتبقية! ⭐</div>
<button class="small" onclick="hint()">💡 ساعدني</button>
<button class="small" onclick="speak()">🔊 استمع</button>
<button class="small" onclick="next()">السؤال التالي ➜</button>
<p id="score">النجوم: 0 ⭐</p>
</div>

<script>
const data=[
[2,1],[3,1],[3,2],[4,1],[4,2],[5,2],[5,3]
];
let i=0,score=0,done=false;

function show(){
 done=false;
 let [a,b]=data[i],c=a-b;
 document.getElementById("fruits").innerHTML=
 "🍎 ".repeat(a-b)+"<span style='opacity:.25;text-decoration:line-through'>🍎 ".repeat(b)+"</span>";
 document.getElementById("equation").textContent=a+" - "+b+" = ؟";
 document.getElementById("question").textContent=
 "كان لدينا "+a+" تفاحات، وأخذنا "+b+" منها. كم بقي؟";
 document.getElementById("feedback").textContent="عدّ التفاحات التي بقيت!";
 let opts=[c,c+1,Math.max(0,c-1)];
 document.getElementById("answers").innerHTML="";
 opts=[...new Set(opts)].sort(()=>Math.random()-.5);
 while(opts.length<3)opts.push(c+2);
 opts=opts.slice(0,3);
 if(!opts.includes(c))opts[0]=c;
 opts.sort(()=>Math.random()-.5);
 opts.forEach(n=>{
 let btn=document.createElement("button");
 btn.textContent=n;
 btn.onclick=()=>check(n,c);
 document.getElementById("answers").appendChild(btn);
 });
}
function check(n,c){
 if(done)return;
 if(n===c){
 done=true;score++;
 document.getElementById("feedback").textContent="🎉 أحسنت! عرفت كم تفاحة بقيت!";
 document.getElementById("score").textContent="النجوم: "+score+" ⭐";
 }else{
 document.getElementById("feedback").textContent="😊 حاول مرة أخرى، عدّ التفاحات الباقية.";
 }
}
function hint(){
 let [a,b]=data[i];
 document.getElementById("feedback").textContent=
 "💡 ابدأ بعدّ "+a+" تفاحات، ثم احذف "+b+" منها.";
}
function speak(){
 let [a,b]=data[i];
 let u=new SpeechSynthesisUtterance("كان لدينا "+a+" تفاحات وأخذنا "+b+" منها. كم تفاحة بقيت؟");
 u.lang="ar-SA";u.rate=.85;speechSynthesis.speak(u);
}
function next(){
 i++;
 if(i>=data.length){
 document.getElementById("fruits").textContent="🏆🍎🏆";
 document.getElementById("equation").textContent="أنت بطل الطرح!";
 document.getElementById("question").textContent="انتهت اللعبة!";
 document.getElementById("answers").innerHTML="";
 document.getElementById("feedback").textContent="رائع! حصلت على "+score+" نجمة.";
 return;
 }
 show();
}
show();
</script>
</body>
</html>
